<!DOCTYPE html><html><head><meta charset="utf-8"><style>@font-face{font-family:M;src:url("file:///home/user/malik-/et-si/survie/cine/../../moteur/fonts/Montserrat[wght].ttf");font-weight:100 900}body{margin:0}</style></head><body><canvas id="c"></canvas>
<script src="file:///home/user/malik-/et-si/survie/cine/cine.js"></script><script src="file:///home/user/malik-/et-si/survie/cine/perso.js"></script><script src="file:///home/user/malik-/et-si/survie/cine/commun.js"></script><script src="file:///home/user/malik-/et-si/survie/cine/decors.js"></script>
<script>
const OR='#FF9F1C';
function fond(x,w,h){x.fillStyle=lg(x,0,0,0,h,[[0,'#101C2C'],[1,'#080B10']]);x.fillRect(0,0,w,h);x.save();x.strokeStyle='rgba(245,245,245,0.05)';x.lineWidth=2;for(let i=0;i<w;i+=60){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke();}for(let i=0;i<h;i+=60){x.beginPath();x.moveTo(0,i);x.lineTo(w,i);x.stroke();}x.restore();}
function glow(x,cx,cy,r,col){x.save();x.globalCompositeOperation='lighter';x.fillStyle=rg(x,cx,cy,0,r,[[0,col],[1,'rgba(0,0,0,0)']]);x.fillRect(cx-r,cy-r,2*r,2*r);x.restore();}
function logo(x,cx,cy,s){x.save();x.translate(cx,cy);x.scale(s,s);x.textAlign='center';x.textBaseline='middle';x.font='900 210px M';x.letterSpacing='6px';
  x.shadowColor='rgba(0,0,0,0.6)';x.shadowBlur=30;x.fillStyle=OR;x.fillText('ET SI',-70,0);x.fillStyle=PAL.blanc;x.fillText('?',345,0);x.shadowBlur=0;x.fillStyle=PAL.rouge;x.fillRect(-300,120,600,16);x.restore();}
function perso(x,cx,cy,u,ex){figure(x,cx,cy,u,{look:0.8,ex:ex||{eye:0.9,brow:0.6,mouth:0.35},near:{to:[cx+0.9*u,cy+1.6*u],hand:'rest'},far:{bend:-1}},PERSOS.heros);}
function profil(){const w=1080,h=1080;cv.width=w;cv.height=h;const x=cv.getContext('2d');fond(x,w,h);glow(x,540,480,520,'rgba(255,140,40,0.28)');
  // grand point d'interrogation orange, petit bandeau
  x.textAlign='center';x.textBaseline='middle';x.font='900 760px M';x.fillStyle=OR;x.shadowColor='rgba(0,0,0,0.6)';x.shadowBlur=40;x.fillText('?',540,520);x.shadowBlur=0;
  x.fillStyle='rgba(8,11,16,0.85)';x.beginPath();x.roundRect(290,790,500,140,24);x.fill();x.fillStyle=PAL.rouge;x.fillRect(290,790,12,140);
  x.font='900 96px M';x.letterSpacing='8px';x.fillStyle=PAL.blanc;x.fillText('ET SI',548,864);return cv.toDataURL('image/png');}
function banniere(w,h,safe){cv.width=w;cv.height=h;const x=cv.getContext('2d');fond(x,w,h);const cx=w/2,cy=h/2;glow(x,cx,cy,Math.max(w,h)*0.45,'rgba(255,140,40,0.16)');
  // pictos de la série de part et d'autre
  const items=[['coeur',-1],['telephone',-1],['couverture',-1],['secours',1],['horloge',1],['pile',1]];let li=0,ri=0;
  for(const [n,side] of items){const k=side<0?li++:ri++;const px=cx+side*(safe.w/2+160+k*230),py=cy+(k%2?60:-60);if(px<80||px>w-80)continue;x.save();x.globalAlpha=0.55;picto(x,n,px,py,0.75,1,'',1);x.restore();}
  // personnage à gauche dans la zone sûre, logo au centre
  x.save();const u=safe.h*0.2;painted(x,f=>perso(f,cx-safe.w*0.34,cy-safe.h*0.12,u,{eye:1,brow:0.8,mouth:0.4}),LT(u,0.9,'rgba(255,170,90,1)'));x.restore();
  x.fillStyle=lg(x,0,cy+safe.h*0.18,0,cy+safe.h*0.5,[[0,'rgba(8,11,16,0)'],[1,'rgba(8,11,16,0.9)']]);x.fillRect(0,cy+safe.h*0.18,w,h);
  logo(x,cx+safe.w*0.08,cy-safe.h*0.12,safe.h/520);
  x.textAlign='center';x.textBaseline='middle';x.font=`800 ${Math.round(safe.h*0.095)}px M`;x.fillStyle=PAL.blanc;x.fillText('Saurais-tu comment réagir ?',cx+safe.w*0.08,cy+safe.h*0.2);
  x.font=`600 ${Math.round(safe.h*0.06)}px M`;x.fillStyle='rgba(245,245,245,0.7)';x.fillText('Les bons gestes en moins d’une minute · 1 vidéo par jour à 18 h',cx+safe.w*0.08,cy+safe.h*0.36);
  return cv.toDataURL('image/png');}
window.READY=document.fonts.load('900 100px M').then(()=>document.fonts.load('600 26px M')).then(()=>true);
</script></body></html>
