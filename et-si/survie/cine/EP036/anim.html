(c,t,d)=>{const [B,b]=sdb(t);malade(b,t,380,820,190,ease(seg(t,0.2,1.0)));LUM(b);accroche(c,t,d,B,camAt(t,d,{x:620,y:960,z:1.1},{x:640,y:960,z:1.2}),['tu vomissais','du sang ?']);},
