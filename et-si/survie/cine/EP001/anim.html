  c.fillStyle=lg(c,0,-152,0,-118,[[0,'#3a3c40'],[1,'#0e0f11']]);c.beginPath();c.roundRect(-410,-156,170,30,15);c.fill();c.fillStyle='rgba(255,255,255,0.12)';c.fillRect(-400,-152,150,5);

      for(let i=0;i<12;i++){const r=mulberry(i+3);const ph=(t*1.8+r())%1;c.fillStyle=`rgba(255,250,230,${0.5*o.shimmer*(1-ph)})`;c.beginPath();c.arc(-92+r()*184,-130,1.5+ph*4,0,TAU);c.fill();}c.globalCompositeOperation='source-over';}}
  // bord

  c.fillStyle=lg(c,-130,0,130,0,[[0,'#5b6067'],[0.35,'#e9ebee'],[0.55,'#a9aeb4'],[1,'#4a4e54']]);c.beginPath();c.moveTo(-130,0);c.bezierCurveTo(-120,-58,120,-58,130,0);c.ellipse(0,0,130,11,0,0,Math.PI);c.closePath();c.fill();

  c.strokeStyle='#777';c.lineWidth=3;c.beginPath();c.arc(466,906,12,0,TAU);c.stroke();for(let i=0;i<3;i++){const a=i*TAU/3;c.beginPath();c.moveTo(466,906);c.lineTo(466+Math.cos(a)*10,906+Math.sin(a)*10);c.stroke();}}
function xMark(c,x,y,r,a){if(a<=0)return;c.save();c.globalAlpha=a;c.strokeStyle=PAL.rouge;c.lineWidth=r*0.22;c.lineCap='round';c.shadowColor='rgba(0,0,0,0.6)';c.shadowBlur=18;

  c.stroke();c.setLineDash([]);const an=Math.atan2(end[1]-prev[1],end[0]-prev[0]);c.translate(end[0],end[1]);c.rotate(an);c.beginPath();c.moveTo(w*2.6,0);c.lineTo(-w*1.4,-w*2);c.lineTo(-w*1.4,w*2);c.closePath();c.fill();c.restore();}

  c.fillStyle='rgba(255,255,255,0.12)';c.beginPath();c.roundRect(x-16,y-190,32,330,16);c.fill();const lv=lerp(1,0.12,k);const col=`rgb(${lerp(229,70,k)|0},${lerp(57,150,k)|0},${lerp(53,230,k)|0})`;

  c.font='800 24px M';c.fillStyle=PAL.blanc;c.textAlign='center';c.fillText(k<0.95?'CHAUD':'FROID',x,y-200+0);c.restore();}

/* ---------- le monde : cuisine ----------
   st = {t, fire, smoke, stir, react, noMan, glass, lidDx (null = pas de couvercle sur la casserole), lidOnCounter, ghostMove, ghostLift,
         spread, knob, hood (1 = allumée), armKnob, armSwitch, armLid, calm} */
function world(st){const B=buf('world',Math.round(W*1.6),H),b=B.getContext('2d');const t=st.t;const react=st.react||0;
  kitchenBack(b);if(st.hood===0){b.fillStyle='#16181b';b.fillRect(600,752,80,6);b.fillRect(790,752,80,6);}
  wallSwitch(b,st.hood!==0);
  // personnage derrière le plan de travail
  if(!st.noMan){const u=150,nx=430-react*70-(st.back||0)*120,ny=840-react*10;const stir=(st.stir??1)*(1-react);
    const tip=[POT.x-20+Math.sin(t*3.0)*48*stir,POT.y-120];const sa=-0.62;const G=[tip[0]+Math.sin(sa)*190,tip[1]-Math.cos(sa)*190];
    const lean=-0.04-0.1*react;const holding=react<0.5;
    // poignet : sur le manche de la spatule (prise), puis main levée qui protège (réaction) — interpolé dans l'espace, le coude suit (IK)
    const Wg=[G[0]-0.12*u,G[1]+0.06*u],Wr=[nx+1.45*u,ny+0.35*u];const Wt=[lerp(Wg[0],Wr[0],ease(react)),lerp(Wg[1],Wr[1],ease(react))];
    painted(b,f=>{figure(f,nx,ny,u,{lean,headDX:-0.06*react,look:st.calm?0.9:0.8,ex:{eye:0.55+0.45*react,brow:react*0.9,mouth:0.4*react},
        near:{to:Wt,hand:holding?'grip':'open',ang:holding?undefined:lerp(-0.4,-1.35,react)},far:{to:[nx-0.55*u+react*0.2*u,ny+2.2*u-react*0.6*u],bend:-1},
        held:holding?(ff=>spatula(ff,tip[0],tip[1],sa)):null});},
      {dx:st.fire>0.2?1:0.3,dy:-0.6,scale:u,col:st.fire>0.2?'rgba(255,150,70,1)':'rgba(255,220,180,1)',k:st.fire>0.2?0.9:0.4});}
  counter(b);knobsAt(b,st.knob??-0.9);
  // casserole, couvercle, feu
  const ld=st.lidDx;const covered=ld!=null&&ld<4;saucepan(b,POT.x,POT.y,t,{shimmer:st.smoke||0,covered});
  if(react>=0.5&&!st.noMan)spatula(b,POT.x+150,1180,1.4);
  if(st.lidOnCounter)lid(b,1120,1196);
  if(st.glass)glassOfWater(b,1060,1196,1.0);
  let fx=POT.x,fw=230,fint=st.fire||0,clipX=null;
  if(ld!=null){const lidL=POT.x+ld-130;const unc=clamp((lidL-(POT.x-112))/224);fint*=Math.pow(unc,0.6);fw=230*Math.max(unc,0.15);fx=(POT.x-112+Math.min(lidL,POT.x+112))/2;clipX=lidL;}
  const L=[lampLight(735,760,st.hood===0?0.55:0.75),{x:200,y:760,r:700,c:'rgba(120,150,200,0.5)'}];if(fint>0||st.spread)L.push(fireLight(POT.x,POT.y-160,0.35+0.75*Math.max(fint,st.spread||0)+0.5*(st.spread||0),t));
  relight(b,L,fint>0.3||st.spread?'#2a2b33':'#3a3b44');
  if(st.smoke)wisps(b,POT.x,POT.y-130,200,t,0.3*st.smoke);
  const sp=st.spread||0;
  if(fint>0||sp){b.save();if(clipX!=null){b.beginPath();b.rect(0,0,clipX,H);b.clip();}
    smoke(b,fx,POT.y-320,480+500*sp,700+400*sp,t,0.45*Math.max(fint,sp));flames(b,fx,POT.y-130,fw+260*sp,360*Math.max(0.4,fint)+620*sp,t,Math.max(fint,sp));b.restore();}
  if(sp>0){flames(b,735,760,420*sp,300*sp,t+2,sp*0.9,4);b.fillStyle=lg(b,0,0,0,900,[[0,`rgba(20,20,24,${0.85*sp})`],[1,'rgba(20,20,24,0)']]);b.fillRect(0,0,W*1.6,900);smoke(b,760,500,1400,500,t,0.5*sp,8);}
  if(ld!=null){lid(b,POT.x+ld,POT.y-132);if(covered&&st.leak)wisps(b,POT.x,POT.y-150,240,t,0.25*st.leak);}
  // fantômes : ce qu'il ne faut PAS faire
  if(st.ghostMove){const g=st.ghostMove;b.save();b.globalAlpha=0.42*Math.min(1,g*3);saucepan(b,POT.x-250*eout(g),POT.y-40*Math.sin(Math.PI*Math.min(1,g*1.2)),t,{covered:true});lid(b,POT.x-250*eout(g),POT.y-132-40*Math.sin(Math.PI*Math.min(1,g*1.2)));b.restore();}
  if(st.ghostLift){const g=st.ghostLift,up=eout(g)*160;flames(b,POT.x,POT.y-136,230,320*g,t,0.75*g,5);b.save();b.globalAlpha=0.55;lid(b,POT.x+30*g,POT.y-132-up);b.restore();}
  // bras qui agissent (personnage hors champ)
  if(st.armKnob){const k=st.armKnob;reach(b,[450,1740],[lerp(600,742,k),lerp(1560,1352,k)],230,'grip',-0.75,1);}
  if(st.armSwitch){const k=st.armSwitch;reach(b,[150,1250],[lerp(240,370,k),lerp(1100,862,k)],230,'point',-0.2,1);}
  if(st.armLid){const kx=POT.x+st.lidDx+58,ky=POT.y-188;const wr=[kx+70,ky+12];reach(b,[wr[0]+330,wr[1]+330],wr,230,'grip',Math.PI+0.1,-1);}
  return B;}
function show(c,B,cam,blur=0){c.save();camXf(c,cam);if(blur)c.filter=`blur(${blur}px)`;c.drawImage(B,0,0);c.restore();}
function fg(c,t,par){c.save();c.filter='blur(14px)';c.translate(par,0);c.fillStyle='#1a1d22';c.fillRect(-40,1660,700,400);c.fillStyle=lg(c,0,1640,0,1680,[[0,'#bdb6a8'],[1,'#6f6a60']]);c.fillRect(-40,1640,700,40);

/* ---------- couloir, porte, extérieur ---------- */
function hallway(c,t,o={}){const close=o.close||0,glow=o.glow??1;
  c.fillStyle=lg(c,0,0,W,0,[[0,'#1a2230'],[0.5,'#243042'],[1,'#151c28']]);c.fillRect(0,0,W,H);c.fillStyle=lg(c,0,1700,0,H,[[0,'#2a2622'],[1,'#141210']]);c.fillRect(0,1700,W,H-1700);
  c.fillStyle='rgba(255,255,255,0.05)';c.fillRect(0,1690,W,10);
  // ouverture vers la cuisine en feu
  const X0=300,X1=740,Y0=520,Y1=1700,fl=0.85+0.15*Math.sin(t*15)*Math.sin(t*4.3);

  c.save();c.beginPath();c.rect(X0,Y0,X1-X0,Y1-Y0);c.clip();smoke(c,520,900,600,600,t,0.7*glow,4,'20,18,18');flames(c,560,1700,500,500,t,0.6*glow,9);c.restore();
  c.fillStyle='#d8d3c8';c.fillRect(X0-26,Y0-26,26,Y1-Y0+26);c.fillRect(X1,Y0-26,26,Y1-Y0+26);c.fillRect(X0-26,Y0-26,X1-X0+52,26);
  // porte (charnière à gauche) qui se referme
  if(close>0){const w=(X1-X0)*eout(close);c.fillStyle=lg(c,X0,0,X0+w,0,[[0,'#9a9184'],[1,'#d4cdc0']]);c.fillRect(X0,Y0,w,Y1-Y0);c.strokeStyle='rgba(0,0,0,0.25)';c.lineWidth=5;c.strokeRect(X0+w*0.1,Y0+60,w*0.8,(Y1-Y0)*0.4);c.strokeRect(X0+w*0.1,Y0+(Y1-Y0)*0.5,w*0.8,(Y1-Y0)*0.42);
    c.fillStyle='#e9e5dc';c.beginPath();c.arc(X0+w-40,1130,12,0,TAU);c.fill();
    if(close>0.98){c.fillStyle=`rgba(255,${130*fl|0},40,${0.9*glow})`;c.fillRect(X0+6,Y1-6,X1-X0-12,6);c.save();c.globalCompositeOperation='lighter';c.fillStyle=rg(c,520,Y1,0,300,[[0,`rgba(255,120,40,${0.35*glow*fl})`],[1,'rgba(255,120,40,0)']]);c.fillRect(200,Y1-300,640,400);c.restore();
      smoke(c,520,Y0-10,420,240,t,0.18,6,'30,30,34',10);}}
  // lumière du couloir : la cuisine éclaire le couloir quand la porte est ouverte
  c.save();c.globalCompositeOperation='lighter';c.fillStyle=rg(c,520,1300,0,900,[[0,`rgba(255,120,40,${0.28*glow*(1-close)*fl})`],[1,'rgba(255,120,40,0)']]);c.fillRect(0,0,W,H);c.restore();
  if(o.door2){c.fillStyle='#0e131c';c.fillRect(880,560,240,1140);c.fillStyle='#cfcabf';c.fillRect(860,540,20,1160);c.fillRect(860,540,260,20);}}
function building(c,t,o={}){c.fillStyle=lg(c,0,0,0,H,[[0,'#060a14'],[0.6,'#0f1a2c'],[1,'#1a2232']]);c.fillRect(0,0,W,H);const rs=mulberry(12);for(let i=0;i<70;i++){c.fillStyle=`rgba(255,255,255,${rs()*0.5})`;c.fillRect(rs()*W,rs()*500,2,2);}
  c.fillStyle='#4a2c22';c.fillRect(60,360,960,1240);c.strokeStyle='rgba(0,0,0,0.25)';c.lineWidth=2;for(let y=380;y<1600;y+=26){c.beginPath();c.moveTo(60,y);c.lineTo(1020,y);c.stroke();}
  const fl=0.8+0.2*Math.sin(t*13)*Math.sin(t*3.7);
  for(let r=0;r<4;r++)for(let k=0;k<3;k++){const x=130+k*310,y=440+r*280;const fire=(r===1&&k===1);c.fillStyle='#d8d0c2';c.fillRect(x-10,y-10,200,200);
    c.fillStyle=fire?lg(c,0,y,0,y+180,[[0,'#5a1e0c'],[1,`rgb(255,${150*fl|0},40)`]]):(rs()>0.6?'#e6c78a':'#162236');c.fillRect(x,y,180,180);
