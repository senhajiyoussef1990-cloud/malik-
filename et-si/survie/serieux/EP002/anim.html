<script>
/* EP002 — Et si un adulte s'étouffait devant toi ? (kit kits-90s-lot-03.json, 11 scènes)
   Les gestes montrés sont uniquement ceux du kit : tapes dans le dos, poussées abdominales,
   alerter les secours, réanimation guidée par l'opérateur. */
const FLOOR=1700,RIM='rgba(255,220,170,0.9)';
function room(b,o={}){
  b.fillStyle=lg(b,0,0,0,1250,[[0,'#6b5d4e'],[1,'#8a7864']]);b.fillRect(0,0,W,H);
  // tableau
  b.fillStyle='#3a2a1c';b.fillRect(120,470,300,230);b.fillStyle=lg(b,130,480,410,690,[[0,'#3d5a6c'],[0.6,'#7d8f7a'],[1,'#b89a6a']]);b.fillRect(136,486,268,198);
  // fenêtre + rideaux
  b.fillStyle='#0d1a2c';b.fillRect(700,430,300,460);b.fillStyle=lg(b,0,430,0,890,[[0,'#172a46'],[1,'#0b1424']]);b.fillRect(712,442,276,436);b.fillStyle='#ded6c6';b.fillRect(846,442,10,436);b.fillRect(712,650,276,10);
  b.fillStyle=lg(b,660,0,740,0,[[0,'#5b2f2a'],[1,'#7b4038']]);b.fillRect(650,400,80,560);b.fillStyle=lg(b,970,0,1050,0,[[0,'#7b4038'],[1,'#5b2f2a']]);b.fillRect(970,400,80,560);
  // lambris
  b.fillStyle=lg(b,0,1250,0,FLOOR,[[0,'#4a3628'],[1,'#3a2a1f']]);b.fillRect(0,1250,W,FLOOR-1250);b.strokeStyle='rgba(0,0,0,0.35)';b.lineWidth=4;for(let x=20;x<W;x+=200)b.strokeRect(x,1290,170,370);b.fillStyle='#5a4433';b.fillRect(0,1240,W,16);
  // parquet
  for(let i=0;i<8;i++){b.fillStyle=i%2?'#4b3423':'#563c28';b.fillRect(0,FLOOR+i*30,W,30);}b.fillStyle='#2b1d13';b.fillRect(0,FLOOR+240,W,H);
  // suspension
  b.strokeStyle='#111';b.lineWidth=4;b.beginPath();b.moveTo(o.lampX||540,0);b.lineTo(o.lampX||540,470);b.stroke();const lx=o.lampX||540;b.fillStyle='#202020';b.beginPath();b.moveTo(lx-80,560);b.lineTo(lx+80,560);b.lineTo(lx+40,470);b.lineTo(lx-40,470);b.closePath();b.fill();b.fillStyle='#ffe9c0';b.beginPath();b.ellipse(lx,560,70,12,0,0,TAU);b.fill();
  if(o.table!==false)table(b,o.tableX||540);}
function table(b,cx){const x0=cx-330,x1=cx+330,y=1300;
  b.fillStyle='#e8e2d6';b.fillRect(x0-10,y-8,x1-x0+20,22);b.fillStyle='rgba(0,0,0,0.15)';b.fillRect(x0-10,y+10,x1-x0+20,60);b.fillStyle='#d9d1c2';b.fillRect(x0-10,y+12,x1-x0+20,56);
  b.fillStyle='#4b3424';b.fillRect(x0+20,y+68,26,FLOOR-y-68);b.fillRect(x1-46,y+68,26,FLOOR-y-68);
  for(const px of [cx-190,cx+190]){b.fillStyle='#f4f1ea';b.beginPath();b.ellipse(px,y-12,100,12,0,0,TAU);b.fill();b.fillStyle='#b9824e';b.beginPath();b.ellipse(px,y-22,44,10,0,0,TAU);b.fill();}
  b.fillStyle='rgba(210,230,245,0.55)';b.fillRect(cx-70,y-110,34,100);b.fillRect(cx+40,y-96,30,86);b.fillStyle='rgba(150,30,40,0.6)';b.fillRect(cx-68,y-60,30,48);
  b.fillStyle='#c49a5c';b.beginPath();b.ellipse(cx,y-40,70,34,0,Math.PI,TAU);b.fill();}
function chair(b,x,dir){b.fillStyle='#3b2a1e';b.fillRect(x-90,1470,180,22);b.fillRect(x-80,1492,18,FLOOR-1492);b.fillRect(x+62,1492,18,FLOOR-1492);const bx=x-dir*90;b.fillRect(bx-(dir>0?0:18),1100,18,390);b.fillRect(bx-(dir>0?0:18)-0,1000,dir*0+18,20);}
const SEAT=(x,dir,extra={})=>({x,y:FLOOR,h:980,dir,hip:[0,-250],pose:P({torso:0.05,legF:[1.5,0.05],legB:[1.45,0.1],armF:[0.5,1.4],armB:[0.4,1.3],...extra})});
const STAND=(x,dir,extra={})=>({x,y:FLOOR,h:980,dir,pose:P(extra)});
// rendu d'une scène : list = [{s,col,mask:true}] dans l'ordre de dessin
function scene(c,t,d,draw,list,camArgs,lights,shiftY=0){const B=buf(0),b=B.getContext('2d');draw(b);const ms=[];
  list.forEach((f,i)=>{if(!f.s.only)groundShadow(b,f.s.x,FLOOR,f.s.h*0.15);const M=person(b,f.s,f.col,f.mask===false?null:10+i);if(M)ms.push(M);});
  applyLight(b,lightmap(lights||[LAMP_L(540,560,1.0)],'#3a3530'));ms.forEach(M=>rimLight(b,M,RIM,-8,-3));
  c.save();c.translate(0,shiftY);if(camArgs)camera(c,t,d,...camArgs);c.drawImage(B,0,0);c.restore();post(c,t);}
const CHOKE=P({torso:0.12,head:-0.12,armF:[0.75,3.25],armB:[0.6,3.2]});
function pulse(c,x,y,k){if(k<=0||k>=1)return;c.save();c.strokeStyle=`rgba(255,255,255,${1-k})`;c.lineWidth=6;c.beginPath();c.arc(x,y,20+k*70,0,TAU);c.stroke();c.restore();}
function dot(c,x,y,col,lab,side=1,a=1){if(a<=0)return;c.save();c.globalAlpha=a;c.fillStyle=col;c.beginPath();c.arc(x,y,14,0,TAU);c.fill();c.strokeStyle='#fff';c.lineWidth=4;c.stroke();if(lab){c.font='700 30px M';c.fillStyle='#fff';c.textAlign=side>0?'left':'right';c.textBaseline='middle';c.shadowColor='#000';c.shadowBlur=10;c.fillText(lab,x+side*30,y);}c.restore();}

const SCENES=[
// 1 — accroche
(c,t,d)=>{scene(c,t,d,b=>{room(b);chair(b,800,-1);},[{s:SEAT(800,-1,CHOKE),col:COL.victime}],[1.7,1.55,780,880]);topShade(c);
  headline(c,'ET SI ?',['un adulte s’étouffait','devant toi ?'],fadeIn(t,0.05,0.4),250);},
// 2 — au repas, ne peut plus parler ni tousser
(c,t,d)=>{const k=ease(seg(t,0.8,1.6));scene(c,t,d,b=>{room(b);chair(b,280,1);chair(b,800,-1);},
  [{s:SEAT(280,1,{head:0.05}),col:COL.homme},{s:SEAT(800,-1,lerpPose(P({torso:0.05,armF:[0.5,1.4],armB:[0.4,1.3]}),CHOKE,k)),col:COL.victime}],[1.05,1.0,540,1150]);
  label(c,'NE PEUT PLUS PARLER',430,fadeIn(t,CUE('parler',2.2)),'red');label(c,'NI TOUSSER',520,fadeIn(t,CUE('tousser',3)),'red');},
// 3 — schéma : obstruction grave
(c,t,d)=>{c.fillStyle=lg(c,0,0,0,H,[[0,'#06080c'],[1,'#10141c']]);c.fillRect(0,0,W,H);
  c.save();c.translate(560,1050);c.strokeStyle='rgba(255,255,255,0.85)';c.lineWidth=6;c.lineJoin='round';c.lineCap='round';
  c.beginPath();c.moveTo(-60,-520);c.bezierCurveTo(180,-560,300,-430,290,-280);c.lineTo(330,-200);c.lineTo(290,-170);c.lineTo(300,-110);c.lineTo(270,-90);c.bezierCurveTo(280,-40,250,0,190,10);c.lineTo(160,60);c.lineTo(150,420);c.stroke(); // profil avant
  c.beginPath();c.moveTo(-60,-520);c.bezierCurveTo(-260,-500,-330,-300,-250,-120);c.bezierCurveTo(-200,-20,-170,40,-150,120);c.lineTo(-160,420);c.stroke(); // arrière
  c.strokeStyle='rgba(120,190,255,0.9)';c.lineWidth=5;c.beginPath();c.moveTo(150,-140);c.bezierCurveTo(60,-120,40,-60,60,40);c.lineTo(60,420);c.moveTo(0,40);c.lineTo(0,420);c.stroke(); // trachée
  c.strokeStyle='rgba(255,200,150,0.7)';c.beginPath();c.moveTo(-60,40);c.lineTo(-60,420);c.moveTo(-110,40);c.lineTo(-110,420);c.stroke(); // œsophage
  const k=ease(seg(t,0.5,1.6));c.fillStyle='#D63024';c.beginPath();c.ellipse(30,lerp(-120,90,k),34,28,0.3,0,TAU);c.fill();pulse(c,30,90,(t*1.2)%1*(k>=1?1:0));
  c.font='600 30px M';c.fillStyle='#fff';c.textAlign='left';c.globalAlpha=fadeIn(t,1.2);c.fillText('voies respiratoires',90,250);c.fillStyle='#ff8a7a';c.fillText('obstruées',90,290);c.restore();
  label(c,'OBSTRUCTION GRAVE',430,fadeIn(t,0.3),'red');label(c,'IL FAUT AGIR RAPIDEMENT',520,fadeIn(t,CUE('agir',2.6)),'dark');post(c,t);},
// 4 — se placer derrière, sur le côté, soutenir la poitrine
(c,t,d)=>{const k=ease(seg(t,0.2,1.8));const vic=STAND(560,-1,{torso:0.1,armF:[0.15,2.8],armB:[0.05,2.7]});const pts=bodyPts(vic);
  const res=STAND(lerp(920,690,k),-1,k<1?walk2(t):{});const hold=ease(seg(t,CUE('soutiens',2.6),CUE('soutiens',2.6)+0.6));
  res.pose.armF=hold>0?lerpPoseArm(res.pose.armF||[0.05,0.1],ikArm(res,[pts.chest[0]-10,pts.chest[1]+10],-1),hold):res.pose.armF;
  scene(c,t,d,b=>{room(b,{tableX:250});},[{s:{...res,skip:'armF'},col:COL.homme},{s:vic,col:COL.victime},{s:{...res,only:'armF'},col:COL.homme,mask:false}],[1.1,1.15,620,1150]);
  label(c,'LÉGÈREMENT DERRIÈRE, SUR LE CÔTÉ',430,fadeIn(t,0.4),'dark');label(c,'SOUTIENS SA POITRINE',520,fadeIn(t,CUE('soutiens',2.6)),'yellow');},
// 5 — pencher en avant, jusqu'à 5 tapes entre les omoplates
(c,t,d)=>{const lean=ease(seg(t,0,0.9));const vic=STAND(560,-1,{torso:lerp(0.1,0.85,lean),head:0.15,armF:[lerp(0.15,0.6,lean),lerp(2.8,0.7,lean)],armB:[lerp(0.05,0.5,lean),lerp(2.7,0.6,lean)]});const pts=bodyPts(vic);
  const res=STAND(690,-1,{torso:0.25,legF:[0.15,0.05],legB:[-0.12,0]});
  res.pose.armF=ikArm(res,[pts.chest[0]+5,pts.chest[1]+25],-1);
  const t0=CUE('tapes',2.2),gap=Math.max(0.5,(d-t0-0.6)/5);let n=0,raise=1;for(let i=0;i<5;i++){const ti=t0+i*gap;if(t>=ti)n=i+1;}
  if(t>=t0){const ph=((t-t0)%gap)/gap;raise=ph<0.25?1-ph/0.25:clamp((ph-0.35)/0.5);}else raise=1;
  const nb=pts.back,out=[-pts.fw[0],-pts.fw[1]];res.pose.armB=ikArm(res,[nb[0]+out[0]*75*raise+pts.up[0]*20*raise,nb[1]+out[1]*75*raise+pts.up[1]*20*raise],1);
  scene(c,t,d,b=>{room(b,{tableX:250});},[{s:{...res,skip:'armF'},col:COL.homme},{s:vic,col:COL.victime},{s:{...res,only:'armF'},col:COL.homme,mask:false}],[1.15,1.2,620,1150]);
  const B=pts.back;const cam=(p)=>p; // overlays in screen space approx (camera small)
  if(t>=t0)pulse(c,620+(B[0]-620)*1.18,1150+(B[1]-1150)*1.18,((t-t0)%gap)/gap*3);
  label(c,'INCLINE-LE VERS L’AVANT',430,fadeIn(t,0.2),'dark');label(c,'JUSQU’À 5 TAPES ENTRE LES OMOPLATES',520,fadeIn(t,t0-0.2),'yellow');counter(c,n,5,1330,fadeIn(t,t0));},
// 6 — vérifier après chaque tape, arrêter si levée
(c,t,d)=>{const vic=STAND(560,-1,{torso:0.85,head:0.15,armF:[0.6,0.7],armB:[0.5,0.6]});const pts=bodyPts(vic);const res=STAND(690,-1,{torso:0.25,legF:[0.15,0.05],legB:[-0.12,0]});
  res.pose.armF=ikArm(res,[pts.chest[0]+5,pts.chest[1]+25],-1);res.pose.armB=ikArm(res,[pts.back[0]-pts.fw[0]*30,pts.back[1]-pts.fw[1]*30],1);
  scene(c,t,d,b=>{room(b,{tableX:250});},[{s:{...res,skip:'armF'},col:COL.homme},{s:vic,col:COL.victime},{s:{...res,only:'armF'},col:COL.homme,mask:false}],[1.35,1.45,560,1000]);
  // cycle tape -> vérifie
  const a=fadeIn(t,0.3);if(a>0){c.save();c.globalAlpha=a;const ph=Math.floor(t/1.1)%2;c.font='700 40px M';c.textAlign='center';c.textBaseline='middle';
    c.fillStyle=ph===0?'#fff':'rgba(255,255,255,0.3)';c.fillText('1 TAPE',W/2-170,1330);c.fillStyle='rgba(255,255,255,0.7)';c.fillText('→',W/2,1330);c.fillStyle=ph===1?'#fff':'rgba(255,255,255,0.3)';c.fillText('VÉRIFIE',W/2+170,1330);c.restore();}
  label(c,'APRÈS CHAQUE TAPE, VÉRIFIE',430,fadeIn(t,0.2),'dark');label(c,'OBSTRUCTION LEVÉE ? ARRÊTE',520,fadeIn(t,CUE('arrete',2.6)),'green');},
// 7 — derrière lui, poing entre nombril et bas du sternum
(c,t,d)=>{const k=ease(seg(t,0.2,1.4));const vic=STAND(560,-1,{torso:0.18,head:0.05,armF:[0.3,0.4],armB:[0.25,0.35]});const pts=bodyPts(vic);
  const res=STAND(lerp(690,615,k),-1,{torso:0.2});const tgt=[pts.abdo[0]+6,pts.abdo[1]];
  res.pose.armF=ikArm(res,tgt,-1);res.pose.armB=ikArm(res,[tgt[0]+12,tgt[1]+4],-1);
  scene(c,t,d,b=>{room(b,{tableX:250});},[{s:{...res,skip:'armF'},col:COL.homme},{s:vic,col:COL.victime},{s:{...res,only:'armF'},col:COL.homme,mask:false}],[1.1,1.15,600,1150]);
  // schéma de face (encart)
  const a=fadeIn(t,CUE('poing',2.4));if(a>0){c.save();c.globalAlpha=a;const ox=800,oy=1000;c.fillStyle='rgba(8,10,14,0.85)';c.beginPath();c.roundRect(ox-170,oy-260,340,520,24);c.fill();
    c.strokeStyle='rgba(255,255,255,0.85)';c.lineWidth=5;c.beginPath();c.moveTo(ox-110,oy-200);c.quadraticCurveTo(ox,oy-235,ox+110,oy-200);c.lineTo(ox+95,oy+40);c.quadraticCurveTo(ox+105,oy+160,ox+90,oy+200);c.lineTo(ox-90,oy+200);c.quadraticCurveTo(ox-105,oy+160,ox-95,oy+40);c.closePath();c.stroke();
    c.beginPath();c.moveTo(ox,oy-200);c.lineTo(ox,oy-60);c.stroke();c.fillStyle='rgba(255,200,0,0.35)';c.fillRect(ox-60,oy-50,120,120);
    dot(c,ox,oy-55,'#fff','bas du sternum',1,1);dot(c,ox,oy+90,'#fff','nombril',1,1);c.fillStyle='#ffc800';c.beginPath();c.roundRect(ox-34,oy-4,68,52,14);c.fill();c.restore();}
  label(c,'PLACE-TOI DERRIÈRE LUI',430,fadeIn(t,0.3),'dark');label(c,'POING ENTRE NOMBRIL ET STERNUM',520,fadeIn(t,CUE('poing',2.4)),'yellow');},
// 8 — jusqu'à 5 poussées vers l'intérieur et le haut
(c,t,d)=>{const vic=STAND(560,-1,{torso:0.18,head:0.05,armF:[0.3,0.4],armB:[0.25,0.35]});const pts=bodyPts(vic);const res=STAND(615,-1,{torso:0.2});
  const t0=0.9,gap=Math.max(0.6,(d-t0-0.6)/5);let n=0,push=0;if(t>=t0){n=Math.min(5,Math.floor((t-t0)/gap)+1);const ph=((t-t0)%gap)/gap;push=ph<0.3?Math.sin(ph/0.3*Math.PI):0;if(t>=t0+5*gap)push=0;}
  const tgt=[pts.abdo[0]+6-pts.fw[0]*28*push+pts.up[0]*30*push,pts.abdo[1]-pts.fw[1]*28*push+pts.up[1]*30*push];
  res.pose.armF=ikArm(res,tgt,-1);res.pose.armB=ikArm(res,[tgt[0]+12,tgt[1]+4],-1);
  scene(c,t,d,b=>{room(b,{tableX:250});},[{s:{...res,skip:'armF'},col:COL.homme},{s:vic,col:COL.victime},{s:{...res,only:'armF'},col:COL.homme,mask:false}],[1.3,1.35,580,1080]);
  // flèche intérieur + haut
  const a=fadeIn(t,0.5);if(a>0){const z=1.3+0.05*eout(clamp(t/d));const sx=580+(pts.abdo[0]-580)*z,sy=1080+(pts.abdo[1]-1080)*z;c.save();c.globalAlpha=a;c.strokeStyle='#ffc800';c.lineWidth=12;c.lineCap='round';c.shadowColor='#000';c.shadowBlur=12;
    c.beginPath();c.moveTo(sx-150,sy+40);c.quadraticCurveTo(sx-20,sy+50,sx+20,sy-80);c.stroke();c.fillStyle='#ffc800';c.beginPath();c.moveTo(sx+50,sy-60);c.lineTo(sx+30,sy-130);c.lineTo(sx-14,sy-74);c.closePath();c.fill();c.restore();}
  label(c,'SAISIS TON POING',430,fadeIn(t,0.2),'dark');label(c,'5 POUSSÉES VERS L’INTÉRIEUR ET LE HAUT',520,fadeIn(t,0.6),'yellow');counter(c,n,5,1330,fadeIn(t,t0));},
// 9 — alterner, faire alerter les secours
(c,t,d)=>{c.fillStyle=lg(c,0,0,0,H,[[0,'#07090d'],[1,'#141922']]);c.fillRect(0,0,W,H);
  const card=(x,y,l1,l2,a)=>{if(a<=0)return;c.save();c.globalAlpha=a;c.fillStyle='rgba(255,255,255,0.07)';c.beginPath();c.roundRect(x-200,y-110,400,220,24);c.fill();c.fillStyle='#ffc800';c.fillRect(x-200,y-110,400,8);c.font='800 60px M';c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.fillText(l1,x,y-24);c.font='600 32px M';c.fillStyle='rgba(255,255,255,0.85)';c.fillText(l2,x,y+40);c.restore();};
  card(W/2-220,800,'5 TAPES','dans le dos',fadeIn(t,0.2));card(W/2+220,800,'5 POUSSÉES','abdominales',fadeIn(t,0.5));
  const a=fadeIn(t,0.8);if(a>0){c.save();c.globalAlpha=a;c.strokeStyle='#fff';c.lineWidth=8;c.lineCap='round';const r=(t*1.5)%TAU;c.beginPath();c.arc(W/2,800,60,r,r+4.5);c.stroke();c.restore();}
  const b=fadeIn(t,CUE('alerter',2.6));if(b>0){c.save();c.globalAlpha=b;c.fillStyle='#0E1424';c.beginPath();c.roundRect(W/2-110,1020,220,360,30);c.fill();c.fillStyle='#e9f1ff';c.beginPath();c.roundRect(W/2-94,1046,188,300,18);c.fill();c.fillStyle='#111';c.font='800 92px M';c.textAlign='center';c.textBaseline='middle';c.fillText('112',W/2,1170);c.fillStyle='#1E9650';c.beginPath();c.arc(W/2,1280,36,0,TAU);c.fill();c.restore();}
  label(c,'ALTERNE SI NÉCESSAIRE',430,fadeIn(t,0.2),'dark');label(c,'FAIS ALERTER LES SECOURS',520,fadeIn(t,CUE('alerter',2.6)),'green');post(c,t);},
// 10 — perte de connaissance : au sol, 112, réanimation guidée
(c,t,d)=>{const cA=CUE('appelle',2.8),cR=CUE('reanimation',4.4);
  const lying={x:430,y:FLOOR,h:980,dir:-1,hip:[0,-70],pose:P({torso:-Math.PI/2+0.02,head:0,legF:[Math.PI/2-0.02,Math.PI/2],legB:[Math.PI/2+0.03,Math.PI/2+0.02],armF:[-Math.PI/2+0.2,-Math.PI/2+0.2],armB:[-Math.PI/2+0.3,-Math.PI/2+0.25]})};
  const lp=bodyPts(lying);const comp=t>cR?Math.max(0,Math.sin((t-cR)*TAU*1.8))*14:0;
  const kneel={x:lp.chest[0]+150,y:FLOOR,h:980,dir:-1,hip:[0,-262+comp*0.4],pose:P({torso:0.55,head:0.3,legF:[0.02,-Math.PI/2+0.05],legB:[-0.04,-Math.PI/2+0.08]})};
  // position du sauveteur : genoux au sol à côté du torse
  const tgt=[lp.chest[0]+20,lp.chest[1]+comp];kneel.pose.armF=ikArm(kneel,tgt,1);kneel.pose.armB=ikArm(kneel,[tgt[0]+6,tgt[1]],1);
