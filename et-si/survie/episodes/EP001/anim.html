<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;src:url("../../../moteur/fonts/Montserrat[wght].ttf");font-weight:100 900}
html,body{margin:0;background:#000}
</style></head>
<body><canvas id="c"></canvas>
<script>
/* Et si ? — EP001 « Et si ta casserole d'huile prenait feu ? »
   Style : pictogrammes animés type consignes de sécurité. Les gestes montrés sont
   uniquement ceux du kit kits-verification/EP001.json. */
const W=1080,H=1920;
const cv=document.getElementById('c');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');
const OR='#FF7A1A',NIGHT='#0B1A33',RED='#FF3B3B',GREEN='#2BD47A',SKIN='#E9B88F',SHIRT='#4C8DFF',PANTS='#1B2440',HAIR='#2A1E18';
const TAU=Math.PI*2;
let CUES={};function setCues(c){CUES=c;}
function CUE(k,def){return CUES[k]!=null?CUES[k]:def;}
let DRAFT=true;function setDraft(b){DRAFT=b;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eout=t=>1-Math.pow(1-t,3);
const eback=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));

/* ---------- helpers ---------- */
function txt(s,x,y,size,col='#fff',w=800,align='center',alpha=1,ls=0){
  ctx.save();ctx.globalAlpha*=alpha;ctx.font=`${w} ${size}px M`;ctx.textAlign=align;ctx.textBaseline='middle';
  if(ls)ctx.letterSpacing=ls+'px';ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=18;ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.restore();}
function pill(s,x,y,size,alpha=1,bg=OR,fg='#0B1A33',icon=null){
  if(alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;ctx.font=`800 ${size}px M`;const iw=icon?size*1.3:0;const w=ctx.measureText(s).width+size*1.1+iw,h=size*1.75;
  ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,h/2);ctx.fill();
  if(icon==='x'){ctx.strokeStyle=fg;ctx.lineWidth=size*0.16;ctx.lineCap='round';const cx=x-w/2+size*0.55+iw*0.35,r=size*0.32;ctx.beginPath();ctx.moveTo(cx-r,y-r);ctx.lineTo(cx+r,y+r);ctx.moveTo(cx+r,y-r);ctx.lineTo(cx-r,y+r);ctx.stroke();}
  if(icon==='v'){ctx.strokeStyle=fg;ctx.lineWidth=size*0.16;ctx.lineCap='round';ctx.lineJoin='round';const cx=x-w/2+size*0.55+iw*0.35,r=size*0.34;ctx.beginPath();ctx.moveTo(cx-r,y);ctx.lineTo(cx-r*0.2,y+r*0.8);ctx.lineTo(cx+r,y-r*0.7);ctx.stroke();}
  ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,x+iw/2,y+2);ctx.restore();}
function popIn(t,t0,dur=0.25){const k=seg(t,t0,t0+dur);return {a:clamp(k*3),s:lerp(0.6,1,eback(k))};}
function cam(t,d,z0,z1,cx=W/2,cy=H/2){const z=lerp(z0,z1,eout(clamp(t/d)));ctx.translate(cx,cy);ctx.scale(z,z);ctx.translate(-cx,-cy);}
function crossMark(x,y,r,k,col=RED){ // circle + slash drawn progressively
  if(k<=0)return;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=r*0.16;ctx.lineCap='round';ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=20;
  ctx.beginPath();ctx.arc(x,y,r,-Math.PI/2,-Math.PI/2+TAU*clamp(k*1.6));ctx.stroke();
  const k2=seg(k,0.55,1);if(k2>0){const a=Math.PI/4;ctx.beginPath();ctx.moveTo(x-Math.cos(a)*r,y-Math.sin(a)*r);ctx.lineTo(x+(Math.cos(a)*r)*(2*k2-1),y+(Math.sin(a)*r)*(2*k2-1));ctx.stroke();}
  ctx.restore();}
function check(x,y,r,k){if(k<=0)return;ctx.save();ctx.fillStyle=GREEN;ctx.globalAlpha=clamp(k*3);ctx.beginPath();ctx.arc(x,y,r*lerp(0.6,1,eback(k)),0,TAU);ctx.fill();
  ctx.strokeStyle='#08321C';ctx.lineWidth=r*0.22;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x-r*0.45,y+r*0.02);ctx.lineTo(x-r*0.1,y+r*0.38);ctx.lineTo(x+r*0.5,y-r*0.35);ctx.stroke();ctx.restore();}

/* ---------- fire & smoke ---------- */
function flames(x,y,w,h,t,int=1){
  ctx.save();
  const g=ctx.createRadialGradient(x,y-h*0.4,0,x,y-h*0.4,h*1.9);g.addColorStop(0,`rgba(255,140,40,${0.5*int})`);g.addColorStop(1,'rgba(255,80,0,0)');
  ctx.fillStyle=g;ctx.fillRect(x-h*2.2,y-h*2.4,h*4.4,h*3.2);
  ctx.globalCompositeOperation='lighter';
  const layers=[['rgba(230,50,20,0.8)',1],['rgba(255,130,30,0.85)',0.78],['rgba(255,215,110,0.95)',0.48]];
  for(const [col,s] of layers){ctx.fillStyle=col;
    for(let i=0;i<7;i++){const fx=x+(i-3)/3*w*0.42*s;const hh=h*s*(0.55+0.45*Math.abs(Math.sin(t*5.3+i*1.7)))*(1-Math.abs(i-3)/5.5)*int;
      const sway=Math.sin(t*7+i*2.1)*w*0.07;const bw=w*0.17*s;
      ctx.beginPath();ctx.moveTo(fx-bw,y);ctx.bezierCurveTo(fx-bw,y-hh*0.5,fx+sway-bw*0.35,y-hh*0.8,fx+sway,y-hh);ctx.bezierCurveTo(fx+sway+bw*0.35,y-hh*0.8,fx+bw,y-hh*0.5,fx+bw,y);ctx.fill();}}
  ctx.restore();
}
function smoke(x,y,t,n=10,spread=80,top=500,alpha=0.35){const r=mulberry(17);
  for(let i=0;i<n;i++){const ph=(t*0.35+r())%1;const yy=y-ph*top;const xx=x+(r()-0.5)*spread+Math.sin(t+i)*30*ph;const rad=30+ph*120;
    ctx.fillStyle=`rgba(90,95,110,${alpha*(1-ph)})`;ctx.beginPath();ctx.arc(xx,yy,rad,0,TAU);ctx.fill();}}

/* ---------- kitchen ---------- */
const CT=1120; // counter top
function kitchen(t,fire=1,personX=null,walk=0,opts={}){
  // wall
  const g=ctx.createLinearGradient(0,0,0,CT);g.addColorStop(0,'#0C1830');g.addColorStop(1,'#16284A');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // fire light on wall
  if(fire>0){const fl=0.85+0.15*Math.sin(t*13)*Math.sin(t*7.7);const gg=ctx.createRadialGradient(760,CT-120,0,760,CT-120,700);gg.addColorStop(0,`rgba(255,120,40,${0.32*fire*fl})`);gg.addColorStop(1,'rgba(255,100,30,0)');ctx.fillStyle=gg;ctx.fillRect(0,0,W,H);}
  // tiles
  ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=2;for(let y=760;y<CT;y+=60){ctx.beginPath();ctx.moveTo(520,y);ctx.lineTo(W,y);ctx.stroke();}for(let x=520;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,760);ctx.lineTo(x,CT);ctx.stroke();}
  // hood
  ctx.fillStyle='#22365E';ctx.beginPath();ctx.moveTo(650,560);ctx.lineTo(870,560);ctx.lineTo(930,680);ctx.lineTo(590,680);ctx.closePath();ctx.fill();ctx.fillRect(705,300,110,260);
  // upper cabinet
  ctx.fillStyle='#1B2E55';ctx.fillRect(900,380,180,300);ctx.fillRect(520,380,110,300);
  // door (left)
  const dk=opts.doorClose??0;
  ctx.fillStyle='#081226';ctx.fillRect(70,560,250,CT+260-560);
  ctx.fillStyle='#24406E';ctx.fillRect(70+250*(1-lerp(0.12,1,dk))*0,560,250*lerp(0.12,1,dk),CT+260-560);
  if(dk>0.9){ctx.fillStyle='#C9D6EA';ctx.beginPath();ctx.arc(290,1000,12,0,TAU);ctx.fill();}
  ctx.strokeStyle='#30507F';ctx.lineWidth=10;ctx.strokeRect(65,555,260,CT+270-560);
  // floor
  ctx.fillStyle='#0A1222';ctx.fillRect(0,CT+260,W,H);
  // counter + cabinets
  ctx.fillStyle='#2A3E66';ctx.fillRect(480,CT,W-480,30);
  ctx.fillStyle='#17294C';ctx.fillRect(490,CT+30,W-490,230);
  ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=3;ctx.strokeRect(500,CT+90,250,160);ctx.strokeRect(910,CT+90,160,160);
  // stove front with knobs
  ctx.fillStyle='#0F1C36';ctx.fillRect(620,CT+30,280,60);
  for(let i=0;i<4;i++){const kx=650+i*70,ky=CT+60;ctx.fillStyle='#C9D6EA';ctx.beginPath();ctx.arc(kx,ky,20,0,TAU);ctx.fill();
    const ang=(i===2&&opts.knobOff!=null)?lerp(-0.9,-Math.PI/2-1.6,opts.knobOff)+Math.PI/2:-0.9+Math.PI/2;ctx.strokeStyle='#0F1C36';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(kx,ky);ctx.lineTo(kx+Math.cos(ang-Math.PI/2)*16,ky+Math.sin(ang-Math.PI/2)*16);ctx.stroke();}
  // cooktop
  ctx.fillStyle='#0B1428';ctx.fillRect(620,CT-6,280,10);
  // pan
  drawPan(760,CT-6);
  if(fire>0){flames(770,CT-62,190,lerp(120,300,fire),t,1);smoke(770,CT-260,t,12,120,520,0.28*fire);}
  if(personX!=null)person(personX,CT+250,1.15,{walk,dir:opts.dir??1,arm:opts.arm});
}
function drawPan(x,y){ctx.fillStyle='#3A4258';ctx.beginPath();ctx.moveTo(x-100,y-60);ctx.lineTo(x+100,y-60);ctx.lineTo(x+86,y);ctx.lineTo(x-86,y);ctx.closePath();ctx.fill();
  ctx.fillStyle='#4B556F';ctx.fillRect(x-104,y-66,208,10);ctx.fillStyle='#262C3C';ctx.beginPath();ctx.roundRect(x-260,y-58,160,20,10);ctx.fill();}

/* ---------- character (flat pictogram) ---------- */
function person(x,y,sc=1,o={}){
  const w=o.walk||0,dir=o.dir||1,arm=o.arm||'down';
  ctx.save();ctx.translate(x,y);ctx.scale(sc*dir,sc);
  const sw=Math.sin(w*TAU)*0.45*(o.walk?1:0);
  // legs
  ctx.fillStyle=PANTS;
  for(const s of [sw,-sw]){ctx.save();ctx.translate(0,-200);ctx.rotate(s);ctx.beginPath();ctx.roundRect(-20,0,40,200,20);ctx.fill();ctx.fillStyle='#0E1424';ctx.beginPath();ctx.roundRect(-22,182,62,24,12);ctx.fill();ctx.restore();ctx.fillStyle=PANTS;}
  // torso
  ctx.fillStyle=SHIRT;ctx.beginPath();ctx.roundRect(-55,-420,110,240,46);ctx.fill();
  // arms
  const armDraw=(rot,len=170)=>{ctx.save();ctx.translate(0,-395);ctx.rotate(rot);ctx.fillStyle=SHIRT;ctx.beginPath();ctx.roundRect(-18,0,36,len*0.55,18);ctx.fill();ctx.fillStyle=SKIN;ctx.beginPath();ctx.roundRect(-15,len*0.5,30,len*0.5,15);ctx.fill();ctx.restore();};
  if(arm==='down'){armDraw(-sw*0.7);armDraw(sw*0.7);}
  else if(arm==='back'){armDraw(-0.5);armDraw(-0.25);}
  else if(arm==='call'){armDraw(0.15);ctx.save();ctx.translate(0,-395);ctx.rotate(-2.4);ctx.fillStyle=SHIRT;ctx.beginPath();ctx.roundRect(-18,0,36,95,18);ctx.fill();ctx.fillStyle=SKIN;ctx.beginPath();ctx.roundRect(-15,90,30,80,15);ctx.fill();ctx.restore();}
  else if(arm==='phone'){armDraw(0.1);ctx.save();ctx.translate(0,-395);ctx.rotate(-2.75);ctx.fillStyle=SHIRT;ctx.beginPath();ctx.roundRect(-18,0,36,90,18);ctx.fill();ctx.fillStyle=SKIN;ctx.beginPath();ctx.roundRect(-15,85,30,70,15);ctx.fill();ctx.restore();
    ctx.fillStyle='#111';ctx.beginPath();ctx.roundRect(28,-560,30,56,6);ctx.fill();}
  // head
  ctx.fillStyle=SKIN;ctx.beginPath();ctx.arc(0,-480,58,0,TAU);ctx.fill();
  ctx.fillStyle=HAIR;ctx.beginPath();ctx.arc(0,-492,60,Math.PI*1.02,Math.PI*1.98);ctx.fill();ctx.fillRect(-60,-500,22,40);
  ctx.fillStyle='#1A1A1A';ctx.beginPath();ctx.arc(24,-482,6,0,TAU);ctx.fill();
  ctx.restore();
}

/* ---------- icons ---------- */
function iconGlass(x,y,s,tilt){ctx.save();ctx.translate(x,y);ctx.rotate(tilt);ctx.scale(s,s);
  ctx.fillStyle='rgba(120,190,255,0.35)';ctx.strokeStyle='#CFE6FF';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-50,-80);ctx.lineTo(50,-80);ctx.lineTo(38,80);ctx.lineTo(-38,80);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(80,160,255,0.8)';ctx.beginPath();ctx.moveTo(-44,-10);ctx.lineTo(44,-10);ctx.lineTo(38,80);ctx.lineTo(-38,80);ctx.closePath();ctx.fill();ctx.restore();}
function iconPhone(x,y,s,num,a=1){ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='#0E1424';ctx.beginPath();ctx.roundRect(-110,-200,220,400,34);ctx.fill();ctx.fillStyle='#E9F1FF';ctx.beginPath();ctx.roundRect(-94,-170,188,330,20);ctx.fill();
  ctx.fillStyle='#0B1A33';ctx.font='900 92px M';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(num,0,-40);
  ctx.fillStyle=GREEN;ctx.beginPath();ctx.arc(0,80,40,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 40px M';ctx.fillText('✆',0,82);ctx.restore();}
function iconShare(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle='#0B1A33';ctx.fillStyle='#0B1A33';ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-14,8);ctx.lineTo(14,-10);ctx.moveTo(-14,8);ctx.lineTo(14,24);ctx.stroke();for(const [a,b] of [[-16,8],[16,-12],[16,26]]){ctx.beginPath();ctx.arc(a,b,9,0,TAU);ctx.fill();}ctx.restore();}
function iconBell(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#0B1A33';ctx.beginPath();ctx.moveTo(-30,20);ctx.quadraticCurveTo(-30,-38,0,-38);ctx.quadraticCurveTo(30,-38,30,20);ctx.closePath();ctx.fill();ctx.fillRect(-38,16,76,8);ctx.beginPath();ctx.arc(0,32,9,0,TAU);ctx.fill();ctx.restore();}

/* ---------- overlays ---------- */
const grainC=(()=>{const c=document.createElement('canvas');c.width=512;c.height=512;const x=c.getContext('2d');const im=x.createImageData(512,512);const r=mulberry(11);for(let i=0;i<im.data.length;i+=4){const v=r()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}x.putImageData(im,0,0);return c})();
function finish(t){
  const g=ctx.createRadialGradient(W/2,H/2,H*0.32,W/2,H/2,H*0.78);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.5)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=0.04;ctx.globalCompositeOperation='overlay';const ox=(t*997%512)|0,oy=(t*613%512)|0;
  for(let y=-oy;y<H;y+=512)for(let x=-ox;x<W;x+=512)ctx.drawImage(grainC,x,y);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  ctx.font='700 30px M';ctx.fillStyle='rgba(255,255,255,0.6)';ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText('© Et si ?',60,250);
  ctx.textAlign='right';ctx.fillText('SIMULATION',W-60,250);
  if(DRAFT){ctx.save();ctx.font='800 24px M';ctx.fillStyle='rgba(255,59,59,0.9)';ctx.textAlign='right';ctx.fillText('BROUILLON · NON VALIDÉ',W-60,288);ctx.restore();}
}
function steps(cur,a){ // 5 step chips for scene 5
  const L=['QUITTE','FERME','AVERTIS','SORS','APPELLE'];const x0=W/2-2*196;
  L.forEach((s,i)=>{const on=i===cur,done=i<cur;ctx.save();ctx.globalAlpha=a;ctx.fillStyle=on?OR:done?'rgba(43,212,122,0.9)':'rgba(255,255,255,0.14)';
    ctx.beginPath();ctx.roundRect(x0+i*196-90,345,180,64,32);ctx.fill();ctx.fillStyle=on||done?'#0B1A33':'rgba(255,255,255,0.8)';ctx.font='800 26px M';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText((i+1)+' '+s,x0+i*196,379);ctx.restore();});
}

/* ---------- scenes ---------- */
function s1(t,d){ // close-up on the burning pan, question first
  ctx.save();ctx.translate(760,CT-80);const z=lerp(2.3,2.05,eout(t/d));ctx.scale(z,z);ctx.translate(-760,-(CT-80));
  kitchen(t,1);ctx.restore();
  ctx.fillStyle='rgba(5,10,22,0.35)';ctx.fillRect(0,0,W,700);
  const a=seg(t,0,0.2),sc=lerp(1.5,1,eback(a));ctx.save();ctx.translate(W/2,400);ctx.scale(sc,sc);txt('ET SI ?',0,0,150,OR,900,'center',a,4);ctx.restore();
  const q=seg(t,0.25,0.5);txt('ta casserole d’huile',W/2,545,70,'#fff',900,'center',q);txt('prenait feu ?',W/2,630,70,'#fff',900,'center',q);
}
function s2(t,d){ // step back, pan stays
  const c=CUE('recule',1.6);
  ctx.save();cam(t,d,1.08,1.0,W/2,1100);
  const px=lerp(470,250,ease(seg(t,0.3,1.6)));const walking=t>0.3&&t<1.6;
  kitchen(t,1,px,walking?t*1.6:0,{dir:1,arm:walking?'down':'back'});
  ctx.restore();
  const p1=popIn(t,0.15);ctx.save();ctx.translate(W/2,520);ctx.scale(p1.s,p1.s);pill('NE COMBATS PAS LE FEU',0,0,40,p1.a,RED,'#fff','x');ctx.restore();
  const p2=popIn(t,c);ctx.save();ctx.translate(W/2,640);ctx.scale(p2.s,p2.s);pill('NE DÉPLACE PAS LA CASSEROLE',0,0,40,p2.a,RED,'#fff','x');ctx.restore();
  // highlight pan stays still
  if(t>c){ctx.save();ctx.strokeStyle='rgba(255,59,59,0.9)';ctx.setLineDash([16,12]);ctx.lineWidth=6;ctx.globalAlpha=seg(t,c,c+0.3);ctx.beginPath();ctx.roundRect(470,CT-90,400,110,24);ctx.stroke();ctx.restore();}
}
function s3(t,d){ // never water : pictogram
  const c=CUE('croix',0.9);
  ctx.fillStyle='#0B1428';ctx.fillRect(0,0,W,H);
  const gg=ctx.createRadialGradient(W/2,1000,0,W/2,1000,800);gg.addColorStop(0,'rgba(255,110,30,0.28)');gg.addColorStop(1,'rgba(255,110,30,0)');ctx.fillStyle=gg;ctx.fillRect(0,0,W,H);
  ctx.save();cam(t,d,1.05,1.0,W/2,950);
  // pan + flames
  drawPan(W/2+40,1180);flames(W/2+50,1124,200,260,t);
  // glass approaching (icon only)
  const gk=ease(seg(t,0.1,c));iconGlass(lerp(W/2-330,W/2-180,gk),lerp(820,760,gk),1.1,lerp(0,-0.9,gk));
  // splash dots (water leaving the glass, frozen before the flames)
  if(gk>0.8){ctx.fillStyle='rgba(120,190,255,0.85)';for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(W/2-120+i*22,820+i*18,9,0,TAU);ctx.fill();}}
  crossMark(W/2,960,330,seg(t,c,c+0.6));
  ctx.restore();
  const p=popIn(t,c+0.2);ctx.save();ctx.translate(W/2,470);ctx.scale(p.s,p.s);pill('JAMAIS D’EAU',0,0,56,p.a,RED,'#fff','x');ctx.restore();
  // schematic : water + oil = fireball
  const b=seg(t,c+0.9,c+1.3);if(b>0){ctx.save();ctx.globalAlpha=b;const y=1310;
    ctx.fillStyle='rgba(120,190,255,0.95)';ctx.beginPath();ctx.moveTo(210,y-40);ctx.quadraticCurveTo(250,y+10,210,y+30);ctx.quadraticCurveTo(170,y+10,210,y-40);ctx.fill();
    txt('+',300,y,60,'#fff',900);ctx.fillStyle='#F3C24B';ctx.beginPath();ctx.roundRect(350,y-30,90,60,12);ctx.fill();txt('huile',395,y,24,'#3A2A00',800);
    txt('=',500,y,60,'#fff',900);
    ctx.fillStyle=OR;ctx.beginPath();for(let i=0;i<16;i++){const a=i/16*TAU,r=i%2?40:78;ctx.lineTo(630+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.closePath();ctx.fill();
    txt('boule de feu',730,y,34,'#FFD2B0',800,'left',1);ctx.restore();}
}
function s4(t,d){ // turn off heat only if safe — close on knobs
  const c=CUE('coupe',0.4);
  const ko=ease(seg(t,c+0.5,c+1.3));
  ctx.save();ctx.translate(855,CT+60);const z=lerp(2.6,2.45,eout(t/d));ctx.scale(z,z);ctx.translate(-855,-(CT+60));
  kitchen(t,1,null,0,{knobOff:ko});
  // hand from lower left (reaches the knob, stays below the flames)
  const hk=ease(seg(t,c,c+0.5))*(1-ease(seg(t,c+1.9,c+2.4)));
  const kx=790,ky=CT+60; // knob n°3
  const ox=lerp(150,0,hk),oy=lerp(120,0,hk);
  ctx.save();ctx.translate(kx+ox,ky+oy);ctx.rotate(-0.75);

let CAPS=[];let OUTRO_Y=1e9;
function setCaptions(c,oy){CAPS=c;if(oy!=null)OUTRO_Y=oy;}
function drawCaption(T){
  const c=CAPS.find(c=>T>=c.s&&T<c.e);if(!c)return;
  const k=clamp((T-c.s)/0.12);const sc=lerp(1.12,1,eout(k));
