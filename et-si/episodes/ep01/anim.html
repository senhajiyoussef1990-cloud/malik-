<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;src:url("../../moteur/fonts/Montserrat[wght].ttf");font-weight:100 900}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c"></canvas>
<script>
const W=1080,H=1920;
const cv=document.getElementById('c');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');
const OR='#FF7A1A',NIGHT='#0B1A33',DEEP='#040914';
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eout=t=>1-Math.pow(1-t,3);
const eback=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const TAU=Math.PI*2;
let CUES={};function setCues(c){CUES=c;}
function CUE(si,def){return CUES[si]!=null?CUES[si]:def;}
let OUTRO_Y=49.5;

/* ---------- périodic value noise -> land / cloud textures ---------- */
const LW=1024,LH=512;
function makeTex(seed,base,oct,gain){
  const r=mulberry(seed);const out=new Float32Array(LW*LH);
  const grids=[];
  for(let o=0;o<oct;o++){const px=base*(1<<o),py=Math.max(2,px/2);const g=new Float32Array(px*(py+1));for(let i=0;i<g.length;i++)g[i]=r();grids.push({px,py,g});}
  let mx=-1e9,mn=1e9;
  for(let y=0;y<LH;y++)for(let x=0;x<LW;x++){
    let v=0,a=1,s=0;
    for(const {px,py,g} of grids){
      const fx=x/LW*px,fy=y/LH*py;const ix=Math.floor(fx),iy=Math.floor(fy);const tx=fx-ix,ty=fy-iy;
      const sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);
      const x0=ix%px,x1=(ix+1)%px,y0=Math.min(iy,py),y1=Math.min(iy+1,py);
      const a00=g[y0*px+x0],a10=g[y0*px+x1],a01=g[y1*px+x0],a11=g[y1*px+x1];
      v+=a*lerp(lerp(a00,a10,sx),lerp(a01,a11,sx),sy);s+=a;a*=gain;
    }
    v/=s;out[y*LW+x]=v;if(v>mx)mx=v;if(v<mn)mn=v;
  }
  for(let i=0;i<out.length;i++)out[i]=(out[i]-mn)/(mx-mn);
  return out;
}
const LAND=makeTex(7,4,6,0.5);
const CLOUD=makeTex(99,6,5,0.55);
const LIGHTS=(()=>{const r=mulberry(5);const a=new Uint8Array(LW*LH);for(let i=0;i<a.length;i++)a[i]=r()<0.012?1:0;return a})();
const TH=0.56;

const gcan=document.createElement('canvas');const gctx=gcan.getContext('2d');
function drawGlobe(cx,cy,r,rot,tilt,opt={}){
  r=Math.round(r);const s=2*r;
  if(gcan.width!==s){gcan.width=s;gcan.height=s;}
  const img=gctx.createImageData(s,s),d=img.data;
  const ct=Math.cos(tilt),st=Math.sin(tilt);
  let Lx=opt.lx??-0.62,Ly=opt.ly??-0.35,Lz=opt.lz??0.70;const ln=Math.hypot(Lx,Ly,Lz);Lx/=ln;Ly/=ln;Lz/=ln;
  const crot=opt.crot??rot*1.15;
  for(let py=0;py<s;py++){const y=(py+0.5-r)/r;
    for(let px=0;px<s;px++){const x=(px+0.5-r)/r;const rr=x*x+y*y;if(rr>1)continue;
      const z=Math.sqrt(1-rr);
      const y2=y*ct-z*st,z2=y*st+z*ct;
      const lat=Math.asin(clamp(-y2,-1,1));
      const lonb=Math.atan2(x,z2);
      let u=((lonb+rot)/TAU)%1;if(u<0)u+=1;
      const v=clamp(0.5-lat/Math.PI,0,0.999);
      const ti=(v*LH|0)*LW+(u*LW|0);
      const h=LAND[ti];
      let cu=((lonb+crot)/TAU)%1;if(cu<0)cu+=1;const cl=CLOUD[(v*LH|0)*LW+(cu*LW|0)];
      const dif=x*Lx+y*Ly+z*Lz;const sh=clamp(dif);const amb=0.13;
      const k=amb+sh*0.95;
      let R,G,B;
      const alat=Math.abs(lat);
      if(alat>1.18+0.12*(h-0.5)){R=205;G=222;B=245;}
      else if(h>TH){const q=(h-TH)/(1-TH);R=lerp(38,92,q);G=lerp(104,128,q);B=lerp(108,96,q);}
      else{const q=h/TH;R=lerp(6,16,q);G=lerp(26,62,q);B=lerp(70,128,q);}
      R*=k;G*=k;B*=k;
      // clouds
      const ca=clamp((cl-0.58)*3)*0.75;R=lerp(R,235*k,ca);G=lerp(G,242*k,ca);B=lerp(B,255*k,ca);
      // night lights
      if(h>TH&&alat<1.1&&dif<0.02&&LIGHTS[ti]&&ca<0.3){const n=clamp((0.02-dif)*6);R+=255*n;G+=150*n;B+=60*n;}
      // specular ocean
      if(h<=TH){const sp=Math.pow(clamp(dif),28)*110;R+=sp;G+=sp*0.8;B+=sp*0.6;}
      // atmosphere rim
      const f=Math.pow(1-z,2.6);R+=lerp(70,255,clamp(-dif))*f*0.0+90*f*(0.3+sh);G+=150*f*(0.3+sh);B+=255*f*(0.4+sh);
      const al=clamp((1-Math.sqrt(rr))*r*1.2);
      const o=(py*s+px)*4;d[o]=R;d[o+1]=G;d[o+2]=B;d[o+3]=al*255;
    }}
  gctx.putImageData(img,0,0);
  // glow
  const g=ctx.createRadialGradient(cx,cy,r*0.9,cx,cy,r*1.35);
  g.addColorStop(0,'rgba(90,160,255,0.35)');g.addColorStop(1,'rgba(90,160,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r*1.35,0,TAU);ctx.fill();
  ctx.drawImage(gcan,cx-r,cy-r);
}

/* ---------- shared layers ---------- */
const STARS=(()=>{const r=mulberry(3);return Array.from({length:420},()=>({x:r()*W,y:r()*H,s:r()*2.2+0.3,a:r()*0.8+0.2,p:r()*TAU}))})();
function starfield(t,drift=0){
  ctx.fillStyle=DEEP;ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W*0.5,H*0.45,0,W*0.5,H*0.45,H*0.7);
  g.addColorStop(0,'rgba(20,45,95,0.55)');g.addColorStop(1,'rgba(4,9,20,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of STARS){const tw=0.65+0.35*Math.sin(t*2+s.p);ctx.globalAlpha=s.a*tw;ctx.fillStyle='#fff';
    const x=((s.x-drift*s.s*30)%W+W)%W;ctx.fillRect(x,s.y,s.s,s.s);}
  ctx.globalAlpha=1;
}
const grainC=(()=>{const c=document.createElement('canvas');c.width=512;c.height=512;const x=c.getContext('2d');const im=x.createImageData(512,512);const r=mulberry(11);for(let i=0;i<im.data.length;i+=4){const v=r()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}x.putImageData(im,0,0);return c})();
function finish(t){
  // vignette
  const g=ctx.createRadialGradient(W/2,H/2,H*0.32,W/2,H/2,H*0.78);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.55)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // grain
  ctx.globalAlpha=0.045;ctx.globalCompositeOperation='overlay';
  const ox=(t*997%512)|0,oy=(t*613%512)|0;
  for(let y=-oy;y<H;y+=512)for(let x=-ox;x<W;x+=512)ctx.drawImage(grainC,x,y);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  // watermark
  ctx.font='700 30px M';ctx.fillStyle='rgba(255,255,255,0.55)';ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.fillText('© Et si ?',60,250);
}
function txt(s,x,y,size,col='#fff',w=800,align='center',alpha=1,ls=0){
  ctx.save();ctx.globalAlpha*=alpha;ctx.font=`${w} ${size}px M`;ctx.textAlign=align;ctx.textBaseline='middle';
  if(ls)ctx.letterSpacing=ls+'px';
  ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=18;ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.restore();
}
function pill(s,x,y,size,alpha=1,bg=OR,fg='#0B1A33'){
  ctx.save();ctx.globalAlpha*=alpha;ctx.font=`800 ${size}px M`;const w=ctx.measureText(s).width+size*1.1,h=size*1.75;
  ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,h/2);ctx.fill();
  ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,x,y+2);ctx.restore();
}
function arrow(x1,y1,x2,y2,wid,col=OR,alpha=1,head=2.4){
  const a=Math.atan2(y2-y1,x2-x1),L=Math.hypot(x2-x1,y2-y1);if(L<2)return;
  ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x1,y1);ctx.rotate(a);
  const hl=Math.min(wid*head,L*0.6);
  ctx.shadowColor=col;ctx.shadowBlur=24;ctx.fillStyle=col;ctx.beginPath();
  ctx.moveTo(0,-wid/2);ctx.lineTo(L-hl,-wid/2);ctx.lineTo(L-hl,-wid*1.25);ctx.lineTo(L,0);ctx.lineTo(L-hl,wid*1.25);ctx.lineTo(L-hl,wid/2);ctx.lineTo(0,wid/2);ctx.closePath();ctx.fill();ctx.restore();
}
function cam(t,d,z0=1.06,z1=1.0,cx=W/2,cy=H/2){const z=lerp(z0,z1,eout(clamp(t/d)));ctx.translate(cx,cy);ctx.scale(z,z);ctx.translate(-cx,-cy);}
function shake(t,t0,dur,amp){const k=seg(t,t0,t0+dur);if(k<=0||k>=1)return;const a=amp*(1-k);ctx.translate(Math.sin(t*93)*a,Math.cos(t*71)*a);}

/* ---------- scene 1 : question first, globe stops ---------- */
function s1(t,d){
  starfield(t,t*0.2);
  ctx.save();cam(t,d,1.08,1.0,W/2,1050);shake(t,1.3,0.7,26);
  const stop=CUE(0,1.3);let rot;
  if(t<stop)rot=t*1.6;else rot=stop*1.6+0.15*(1-Math.exp(-(t-stop)*18));
  drawGlobe(W/2,1050,350,rot+1.2,0.18,{crot:rot*1.15+(t>stop?(t-stop)*0.9:0)});
  const k=seg(t,stop,stop+0.9);if(k>0&&k<1){ctx.strokeStyle=OR;ctx.globalAlpha=(1-k)*0.9;ctx.lineWidth=14*(1-k)+2;ctx.beginPath();ctx.arc(W/2,1050,350+k*420,0,TAU);ctx.stroke();ctx.globalAlpha=1;}
  ctx.restore();
  if(t>stop){pill("STOP",W/2,1050,54,seg(t,stop,stop+0.12)*clamp((d-0.9-t)*3));}
  const a=seg(t,0,0.2);{const sc=lerp(1.5,1,eback(a));ctx.save();ctx.translate(W/2,330);ctx.scale(sc,sc);txt('ET SI ?',0,0,150,OR,900,'center',a,4);ctx.restore();}
  const q=seg(t,0.25,0.5);txt('la Terre s’arrêtait',W/2,470,70,'#fff',900,'center',q);txt('de tourner ?',W/2,555,70,'#fff',900,'center',q);
}
/* ---------- scene 2 : equator city ---------- */
const BLD=(()=>{const r=mulberry(21);const a=[];let x=0;while(x<2600){const w=40+r()*90,h=60+Math.pow(r(),2)*380;a.push({x,w,h,win:mulberry((r()*1e9)|0)});x+=w+4+r()*14;}return a})();
function skyDusk(top='#081428',mid='#1B2D5A',hor='#FF8A3A'){const g=ctx.createLinearGradient(0,0,0,H*0.62);g.addColorStop(0,top);g.addColorStop(0.65,mid);g.addColorStop(1,hor);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function s2(t,d){
  skyDusk();
  ctx.save();cam(t,d,1.1,1.0,W/2,1100);
  const R=4200,cy=1180+R;const arcY=x=>cy-Math.sqrt(R*R-(x-W/2)**2);
  // sun glow at horizon (west)
  const sg=ctx.createRadialGradient(-80,1150,0,-80,1150,700);sg.addColorStop(0,'rgba(255,170,80,0.9)');sg.addColorStop(1,'rgba(255,120,30,0)');ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
  // clouds
  for(let i=0;i<7;i++){const cx=((i*260+t*60)%1500)-200,cyy=380+i*85;ctx.fillStyle='rgba(255,180,120,0.10)';ctx.beginPath();ctx.ellipse(cx,cyy,220,26,0,0,TAU);ctx.fill();}
  // ground
  ctx.fillStyle='#050C1A';ctx.beginPath();ctx.moveTo(-50,H);for(let x=-50;x<=W+50;x+=20)ctx.lineTo(x,arcY(x));ctx.lineTo(W+50,H);ctx.fill();
  // buildings scroll east (to the right)
  const off=(t*240)%2600;
  for(const b of BLD){let x=b.x+off-2600;for(let k=0;k<2;k++,x+=2600){if(x>W+60||x+b.w<-60)continue;
    const by=arcY(x+b.w/2)+6;ctx.fillStyle='#0A1630';ctx.fillRect(x,by-b.h,b.w,b.h+8);
    ctx.fillStyle='rgba(255,170,70,0.85)';const wr=mulberry((b.x*13)|0);
    for(let yy=by-b.h+14;yy<by-14;yy+=24)for(let xx=x+8;xx<x+b.w-10;xx+=18){if(wr()<0.28)ctx.fillRect(xx,yy,7,10);}
  }}
  // horizon line glow
  ctx.strokeStyle='rgba(255,140,60,0.7)';ctx.lineWidth=3;ctx.beginPath();for(let x=-50;x<=W+50;x+=20){const y=arcY(x);x<-40?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();
  // speed streaks
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=3;for(let i=0;i<14;i++){const y=900+i*22,x=((i*157+t*900)%1400)-200;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+160,y);ctx.stroke();}
  ctx.restore();
  // arrow + counter
  const a=seg(t,0.3,1.4);arrow(150,640,lerp(150,940,eout(a)),640,46,OR,clamp(a*4));
  const v=Math.round(1670*eout(seg(t,0.3,2.6)));
  txt(v.toLocaleString('fr-FR').replace(/ | /g,' ')+' km/h',W/2,500,124,'#fff',900,'center',clamp(a*4));
  txt('VITESSE AU SOL À L’ÉQUATEUR',W/2,800,34,'#FFD2B0',700,'center',seg(t,1,1.5),3);
  txt('EST →',940,720,36,OR,800,'right',seg(t,1.2,1.6),2);
}
/* ---------- scene 3 : train ---------- */
function s3(t,d){
  ctx.fillStyle='#0A1428';ctx.fillRect(0,0,W,H);
  ctx.save();cam(t,d,1.05,1.0);
  const wx=80,wy=360,ww=920,wh=700;
  ctx.save();ctx.beginPath();ctx.roundRect(wx,wy,ww,wh,60);ctx.clip();
  const g=ctx.createLinearGradient(0,wy,0,wy+wh);g.addColorStop(0,'#13254D');g.addColorStop(0.7,'#C9612A');g.addColorStop(1,'#FF9A4A');ctx.fillStyle=g;ctx.fillRect(wx,wy,ww,wh);
  // far hills
  ctx.fillStyle='#22325C';ctx.beginPath();ctx.moveTo(wx,wy+wh);for(let x=0;x<=ww;x+=10){ctx.lineTo(wx+x,wy+wh*0.66-40*Math.sin((x+t*60)/120)-20*Math.sin((x+t*60)/47));}ctx.lineTo(wx+ww,wy+wh);ctx.fill();
  ctx.fillStyle='#0E1A36';ctx.beginPath();ctx.moveTo(wx,wy+wh);for(let x=0;x<=ww;x+=10){ctx.lineTo(wx+x,wy+wh*0.8-30*Math.sin((x+t*260)/90));}ctx.lineTo(wx+ww,wy+wh);ctx.fill();
  // poles fast
  ctx.fillStyle='#060C1C';for(let i=0;i<6;i++){const x=wx+((i*260-t*1400)%1560+1560)%1560-200;ctx.fillRect(x,wy+120,16,wh);ctx.fillRect(x-60,wy+150,140,8);}
  ctx.restore();
  // frame
  ctx.lineWidth=26;ctx.strokeStyle='#1E2E52';ctx.beginPath();ctx.roundRect(wx,wy,ww,wh,60);ctx.stroke();
  ctx.fillStyle='#0F1C38';ctx.fillRect(0,wy+wh+13,W,H);
  // floor & seat
  ctx.fillStyle='#14244A';ctx.fillRect(0,1180,W,40);
  // passenger silhouette standing, calm (very subtle bob)
  const bob=Math.sin(t*3)*2;ctx.save();ctx.translate(640,bob);ctx.fillStyle='#050A16';
  ctx.beginPath();ctx.arc(0,640,62,0,TAU);ctx.fill();
  ctx.beginPath();ctx.roundRect(-85,710,170,330,60);ctx.fill();
  ctx.fillRect(-70,1000,55,190);ctx.fillRect(15,1000,55,190);
  ctx.beginPath();ctx.roundRect(70,760,40,170,20);ctx.fill();
  // cup with flat liquid
  ctx.fillStyle='#F2F2F2';ctx.fillRect(-170,830,70,86);ctx.fillStyle='#050A16';ctx.beginPath();ctx.roundRect(-120,760,40,120,20);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=5;for(let i=0;i<2;i++){ctx.beginPath();ctx.moveTo(-150+i*28,820);ctx.bezierCurveTo(-160+i*28,790+Math.sin(t*4+i)*6,-130+i*28,770,-145+i*28,740);ctx.stroke();}
  ctx.restore();
  ctx.restore();
  // inset globe
  const a=seg(t,0.6,1.2);if(a>0){ctx.save();ctx.globalAlpha=a;drawGlobe(220,1160,120,t*1.2,0.2);ctx.restore();
    ctx.strokeStyle=OR;ctx.lineWidth=5;ctx.globalAlpha=a;ctx.beginPath();ctx.arc(220,1160,150,-2.4,-0.6);ctx.stroke();ctx.globalAlpha=1;arrow(300,1035,330,1060,10,OR,a,2.2);}
  pill('TOUT BOUGE ENSEMBLE',W/2,250+20,40,seg(t,0.3,0.7));
}
/* ---------- scene 4 : street, objects keep going ---------- */
const OBJ=[{k:'bench',x:140,w:230},{k:'bin',x:470,w:80},{k:'box',x:620,w:110},{k:'pot',x:800,w:90},{k:'scoot',x:300,w:150,far:1},{k:'ball',x:900,w:60}];
function drawObj(o,x,y){ctx.fillStyle='#DCE6F5';ctx.strokeStyle='#DCE6F5';
  if(o.k==='bench'){ctx.fillRect(x,y-70,o.w,16);ctx.fillRect(x,y-120,o.w,14);ctx.fillRect(x+14,y-70,14,70);ctx.fillRect(x+o.w-28,y-70,14,70);}
  if(o.k==='bin'){ctx.fillStyle='#3F7FD0';ctx.beginPath();ctx.roundRect(x,y-130,o.w,130,10);ctx.fill();}
  if(o.k==='box'){ctx.fillStyle='#C98A4E';ctx.fillRect(x,y-100,o.w,100);ctx.fillStyle='#A06A36';ctx.fillRect(x+o.w/2-8,y-100,16,100);}
  if(o.k==='pot'){ctx.fillStyle='#D86A2A';ctx.beginPath();ctx.moveTo(x,y-80);ctx.lineTo(x+o.w,y-80);ctx.lineTo(x+o.w-14,y);ctx.lineTo(x+14,y);ctx.fill();ctx.fillStyle='#3FA36B';ctx.beginPath();ctx.arc(x+o.w/2,y-120,50,0,TAU);ctx.fill();}
  if(o.k==='scoot'){ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(x+20,y-24);ctx.lineTo(x+o.w-20,y-24);ctx.lineTo(x+o.w-30,y-150);ctx.stroke();ctx.beginPath();ctx.arc(x+22,y-20,20,0,TAU);ctx.arc(x+o.w-22,y-20,20,0,TAU);ctx.fill();}
  if(o.k==='ball'){ctx.fillStyle=OR;ctx.beginPath();ctx.arc(x+30,y-30,30,0,TAU);ctx.fill();}
}
function s4(t,d){
  skyDusk('#0A1530','#233A6E','#E0773A');
  ctx.save();shake(t,0.7,0.6,22);
  // buildings bg (static = ground)
  const r=mulberry(4);ctx.fillStyle='#0C1834';for(let i=0;i<9;i++){const x=i*130-20,h=300+r()*420;ctx.fillRect(x,1150-h,118,h);}
  ctx.fillStyle='rgba(255,170,70,0.8)';const r2=mulberry(8);for(let i=0;i<9;i++)for(let j=0;j<16;j++)if(r2()<0.3)ctx.fillRect(i*130+r2()*90,450+j*40+r2()*10,10,14);
  ctx.fillStyle='#08101F';ctx.fillRect(0,1150,W,H);ctx.fillStyle='#1A2848';ctx.fillRect(0,1150,W,12);
  // lamp posts fixed
  ctx.fillStyle='#152446';for(const x of [60,560,1010]){ctx.fillRect(x,780,14,370);ctx.fillRect(x-30,780,74,12);}
  const st=0.7;
  for(const o of OBJ){let dx=0;if(t>st){const u=t-st;dx=u*u*90+u*170;}
    const x=o.x+dx*(o.k==='ball'?1.3:1);const y=o.far?1120:1150;
    if(dx>4){ctx.globalAlpha=0.35;for(let i=1;i<5;i++){ctx.fillStyle='#fff';ctx.fillRect(x-i*40,y-60-i*3,30,4);} ctx.globalAlpha=1;}
    ctx.save();if(t>st&&o.k!=='bench'){ctx.translate(x+o.w/2,y);ctx.rotate(clamp(dx/600)*0.25);ctx.translate(-x-o.w/2,-y);}drawObj(o,x,y);ctx.restore();}
  // papers flying
  if(t>st){const rr=mulberry(9);for(let i=0;i<18;i++){const u=t-st;const x=rr()*W*0.7+u*(500+rr()*600),y=900+rr()*240-u*40*rr();ctx.save();ctx.translate(x,y);ctx.rotate(u*6*rr());ctx.fillStyle='rgba(240,240,255,0.8)';ctx.fillRect(-10,-7,20,14);ctx.restore();}}
  ctx.restore();
  // arrows
  const a=seg(t,st,st+0.4);for(let i=0;i<3;i++)arrow(180,560+i*0,lerp(180,900,eout(a)),560,34,OR,a*(i===0?1:0));
  txt('LE SOL S’ARRÊTE…',W/2,420,56,'#fff',900,'center',seg(t,0.1,0.4));
  txt('…LE RESTE CONTINUE VERS L’EST',W/2,680,40,OR,800,'center',seg(t,st+0.2,st+0.6));
  pill('VUE RALENTIE · ILLUSTRATION',W/2,1260,28,seg(t,1.2,1.6),'rgba(255,255,255,0.12)','#fff');
}
/* ---------- scene 5 : aerial clouds over coast ---------- */
function s5(t,d){
  ctx.save();cam(t,d,1.15,1.0,W/2,H/2);
  ctx.fillStyle='#071B3A';ctx.fillRect(0,0,W,H);
  // sea texture
  ctx.globalAlpha=0.25;ctx.strokeStyle='#2A5C9A';ctx.lineWidth=2;for(let y=0;y<H;y+=28){ctx.beginPath();for(let x=0;x<=W;x+=30)ctx.lineTo(x,y+Math.sin(x/70+y)*5);ctx.stroke();}ctx.globalAlpha=1;
  // coastline (land on left/bottom)
  ctx.fillStyle='#14302F';ctx.beginPath();ctx.moveTo(-10,H);
  for(let y=H;y>=0;y-=20){const x=380+140*Math.sin(y/260)+60*Math.sin(y/73)+25*Math.sin(y/23);ctx.lineTo(x,y);}ctx.lineTo(-10,0);ctx.fill();
  ctx.strokeStyle='rgba(200,230,255,0.35)';ctx.lineWidth=5;ctx.beginPath();for(let y=H;y>=0;y-=20){const x=380+140*Math.sin(y/260)+60*Math.sin(y/73)+25*Math.sin(y/23);ctx.lineTo(x+8,y);}ctx.stroke();
  // city lights on land
  const r=mulberry(31);for(let i=0;i<260;i++){const y=r()*H,x=r()*(300+120*Math.sin(y/260));ctx.fillStyle=`rgba(255,${150+r()*60|0},70,${0.4+r()*0.5})`;ctx.fillRect(x,y,3,3);}
  // fast clouds streaking east
  const rc=mulberry(77);
  for(let i=0;i<40;i++){const y=rc()*H,len=180+rc()*420,sp=900+rc()*900,th=18+rc()*50;const x=((rc()*1600+t*sp)%1800)-400;
    const gg=ctx.createLinearGradient(x,0,x+len,0);gg.addColorStop(0,'rgba(230,240,255,0)');gg.addColorStop(0.7,`rgba(230,240,255,${0.25+rc()*0.3})`);gg.addColorStop(1,'rgba(230,240,255,0)');
    ctx.fillStyle=gg;ctx.beginPath();ctx.ellipse(x+len/2,y,len/2,th,0,0,TAU);ctx.fill();}
  // wind lines
  ctx.strokeStyle='rgba(255,122,26,0.8)';ctx.lineWidth=6;ctx.lineCap='round';
  for(let i=0;i<7;i++){const y=380+i*170,x=((i*300+t*1400)%1700)-400;ctx.beginPath();ctx.moveTo(x,y);ctx.bezierCurveTo(x+120,y-30,x+220,y+30,x+360,y-10);ctx.stroke();}
  ctx.restore();
  pill('L’ATMOSPHÈRE CONTINUE SA COURSE',W/2,320,38,seg(t,0.4,0.8));
}
/* ---------- scene 6 : ocean surge cross-section ---------- */
function s6(t,d){
  skyDusk('#081226','#1A2C58','#7A4A5A');
  ctx.save();cam(t,d,1.08,1.0,W/2,1100);
  const ground=x=>x<420?1300:1300-Math.min(1,(x-420)/260)*170;
  // bedrock
  ctx.fillStyle='#1A1522';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=10)ctx.lineTo(x,ground(x)+60);ctx.lineTo(W,H);ctx.fill();
  ctx.fillStyle='#2A2030';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=10)ctx.lineTo(x,ground(x));ctx.lineTo(W,H);ctx.fill();
  // layers
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=3;for(let k=1;k<6;k++){ctx.beginPath();for(let x=0;x<=W;x+=20)ctx.lineTo(x,ground(x)+k*90+Math.sin(x/90+k)*8);ctx.stroke();}
  // city on land
  const r=mulberry(12);for(let i=0;i<9;i++){const x=640+i*52,h=60+r()*180;const gy=ground(x);ctx.fillStyle='#0B1530';ctx.fillRect(x,gy-h,44,h);ctx.fillStyle='rgba(255,170,70,0.7)';for(let yy=gy-h+10;yy<gy-10;yy+=22)if(r()<0.6)ctx.fillRect(x+10,yy,8,10);}
  // water: base sea + surge moving east
  const front=lerp(380,1180,ease(seg(t,0.3,d-0.3)));
  ctx.fillStyle='rgba(30,110,200,0.85)';ctx.beginPath();ctx.moveTo(0,H);
  const base=1220;
  for(let x=0;x<=W;x+=8){let y;
    const dist=front-x;
    if(dist>=0){const crest=Math.exp(-dist/140)*200;y=Math.min(ground(x),base-crest-10*Math.sin(x/40+t*6)) ;}
    else{const tail=Math.max(0,1+dist/40);y=lerp(ground(x),base-200,tail);if(tail<=0)y=ground(x);}
    ctx.lineTo(x,y);}
  ctx.lineTo(W,H);ctx.fill();
  // foam at crest
  ctx.fillStyle='rgba(235,245,255,0.85)';for(let i=0;i<30;i++){const x=front-20-Math.random()*0+(-i*6),y=1020+Math.sin(i+t*8)*12+i*4;if(x>0)ctx.beginPath(),ctx.arc(x,y,8+((i*7)%5),0,TAU),ctx.fill();}
  ctx.restore();
  arrow(160,560,lerp(160,900,eout(seg(t,0.4,1.2))),560,34,'#4FA8FF',1);
  pill('LES OCÉANS CONTINUENT VERS L’EST',W/2,420,36,seg(t,0.2,0.6));
  pill('Rues désertes · illustration',W/2,1450-160,26,seg(t,1,1.4),'rgba(255,255,255,0.12)','#fff');
}
/* ---------- scene 7 : latitudes ---------- */
function s7(t,d){
  starfield(t);
  const cx=W/2-170,cy=880,r=340,tilt=0.5;
  ctx.save();cam(t,d,1.08,1.0,cx,cy);
  drawGlobe(cx,cy,r,t*0.25+2,tilt,{lx:-0.4,ly:-0.5,lz:0.75});
  const lats=[[0,'1 670 km/h'],[30,'≈ 1 450'],[60,'≈ 835'],[88,'≈ 0']];
  lats.forEach(([lat,lab],i)=>{const a=seg(t,0.4+i*0.35,0.9+i*0.35);if(a<=0)return;
    const la=lat*Math.PI/180;const y0=Math.sin(la),z0=Math.cos(la);
    // world (0,y0,z0) -> screen : y2=y*ct - z*st inverse ... we used y2=y*ct-z*st on screen coords; solve screen point: screen y_s, z_s with y2=-sin(la), z2=cos(la)
    const ct=Math.cos(tilt),st=Math.sin(tilt);const Y2=-y0,Z2=z0; // invert rotation
    const ys=Y2*ct+Z2*st;const sy=cy+ys*r;
    const L=Math.cos(la)*330;
    // latitude ellipse
    ctx.strokeStyle='rgba(255,122,26,0.5)';ctx.lineWidth=3;ctx.globalAlpha=a;ctx.beginPath();ctx.ellipse(cx,cy+(-y0*ct)*r,Math.cos(la)*r,Math.cos(la)*r*st,0,0,Math.PI);ctx.stroke();ctx.globalAlpha=1;
    arrow(cx,sy,cx+Math.max(L*eout(a),4),sy,lat>80?10:26,OR,a);
    txt(lab,cx+Math.max(L,40)+30+ (lat>80?20:0),sy-(lat>80?0:0),lat===0?52:44,'#fff',900,'left',a);
  });
  ctx.restore();
  pill('PLUS ON VA VERS LE PÔLE, MOINS ÇA VA VITE',W/2,320,32,seg(t,0.2,0.6));
}
/* ---------- scene 8 : gravity stays, orbit ---------- */
function drawSun(x,y,r,t){const g=ctx.createRadialGradient(x,y,0,x,y,r*4);g.addColorStop(0,'rgba(255,230,170,1)');g.addColorStop(0.18,'rgba(255,170,60,0.9)');g.addColorStop(0.45,'rgba(255,110,20,0.25)');g.addColorStop(1,'rgba(255,90,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*4,0,TAU);ctx.fill();ctx.fillStyle='#FFE2A8';ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
function miniEarth(x,y,r,sx,sy,mark){ // lit toward sun (sx,sy)
  const a=Math.atan2(sy-y,sx-x);
  ctx.fillStyle='#0A2246';ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.clip();
  ctx.fillStyle='#3C86D8';ctx.beginPath();ctx.arc(x+Math.cos(a)*r*0.02,y+Math.sin(a)*r*0.02,r,a-Math.PI/2,a+Math.PI/2);ctx.fill();
  ctx.fillStyle='#3E8F7A';ctx.beginPath();ctx.arc(x-r*0.2,y-r*0.1,r*0.35,0,TAU);ctx.arc(x+r*0.35,y+r*0.3,r*0.25,0,TAU);ctx.fill();
  // shadow overlay
  ctx.fillStyle='rgba(3,8,20,0.72)';ctx.beginPath();ctx.arc(x,y,r+2,a+Math.PI/2,a+Math.PI*1.5);ctx.fill();
  ctx.restore();
  ctx.strokeStyle='rgba(120,180,255,0.6)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r+3,0,TAU);ctx.stroke();
  if(mark){ctx.fillStyle=OR;ctx.beginPath();ctx.arc(x,y-r*0.78,r*0.16,0,TAU);ctx.fill();ctx.strokeStyle=OR;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y-r*0.95);ctx.lineTo(x,y-r*1.5);ctx.stroke();}
}
function s8(t,d){
  const sw=CUE(7,2.6);const k=ease(seg(t,sw-0.3,sw+0.5));
  // part A: ground with objects
  if(k<1){ctx.save();ctx.globalAlpha=1-k;skyDusk('#0A1530','#203868','#D0703A');
    ctx.fillStyle='#08101F';ctx.fillRect(0,1150,W,H);ctx.fillStyle='#1A2848';ctx.fillRect(0,1150,W,12);
    drawObj(OBJ[0],140,1150);drawObj(OBJ[1],470,1150);drawObj(OBJ[3],800,1150);
    for(const x of [255,510,845]){arrow(x,760,x,lerp(760,960,eout(seg(t,0.2,0.9))),26,OR,seg(t,0.2,0.4)*(1-k),2.2);}
    pill('LA GRAVITÉ RESTE',W/2,560,46,seg(t,0.3,0.7)*(1-k));
    ctx.restore();}
  if(k>0){ctx.save();ctx.globalAlpha=k;starfield(t);
    const sx=W/2,sy=900;drawSun(sx,sy,70,t);
    ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.setLineDash([10,14]);ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(sx,sy,400,400,0,0,TAU);ctx.stroke();ctx.setLineDash([]);
    const ang=-0.6+(t-sw)*0.35;const ex=sx+Math.cos(ang)*400,ey=sy+Math.sin(ang)*400;
    miniEarth(ex,ey,40,sx,sy,false);
    pill('L’ORBITE NE CHANGE PAS',W/2,400,42,seg(t,sw+0.3,sw+0.7));
    ctx.restore();}
}
/* ---------- scene 9 : 1 day = 1 year ---------- */
function s9(t,d){
  starfield(t);
  const sx=W/2,sy=930;drawSun(sx,sy,64,t);
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.setLineDash([10,14]);ctx.lineWidth=3;ctx.beginPath();ctx.arc(sx,sy,360,0,TAU);ctx.stroke();ctx.setLineDash([]);
  const p=ease(seg(t,0.4,d-0.3));const ang=-Math.PI/2+p*TAU;
  // trail
  ctx.strokeStyle=OR;ctx.lineWidth=6;ctx.globalAlpha=0.8;ctx.beginPath();ctx.arc(sx,sy,360,-Math.PI/2,ang);ctx.stroke();ctx.globalAlpha=1;
  const ex=sx+Math.cos(ang)*360,ey=sy+Math.sin(ang)*360;
  miniEarth(ex,ey,58,sx,sy,true);
  // label day/night for marker (marker always points up)
  const lit=Math.sin(ang)>0; // sun below the earth -> marker (top) in night when earth is below sun? marker up; sun direction = -(sin)
  const dy=ey-sy;const lab=dy>90?'JOUR':dy<-90?'NUIT':'';
  txt(lab,ex,ey-125,34,lab==='JOUR'?'#FFD27A':lab==='NUIT'?'#9DB8FF':'#FFB07A',800,'center',seg(t,0.6,0.9));
  // clock
  const cxk=W/2,cyk=360,rk=95;ctx.strokeStyle='#fff';ctx.lineWidth=6;ctx.beginPath();ctx.arc(cxk,cyk,rk,0,TAU);ctx.stroke();
  for(let i=0;i<12;i++){const a=i/12*TAU;ctx.beginPath();ctx.moveTo(cxk+Math.cos(a)*rk*0.82,cyk+Math.sin(a)*rk*0.82);ctx.lineTo(cxk+Math.cos(a)*rk*0.95,cyk+Math.sin(a)*rk*0.95);ctx.stroke();}
  const hs=t*t*3;ctx.lineCap='round';ctx.strokeStyle=OR;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(cxk,cyk);ctx.lineTo(cxk+Math.sin(hs*12)*rk*0.75,cyk-Math.cos(hs*12)*rk*0.75);ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(cxk,cyk);ctx.lineTo(cxk+Math.sin(hs)*rk*0.5,cyk-Math.cos(hs)*rk*0.5);ctx.stroke();
  txt('1 JOUR ≈ 1 AN',W/2,540,72,'#fff',900,'center',seg(t,0.8,1.2));
  txt('≈ 6 mois de jour · ≈ 6 mois de nuit',W/2,1350,36,'#FFD2B0',700,'center',seg(t,2,2.5));
}
/* ---------- scene 10 : outro / next episode ---------- */
function mug(x,y,sc,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sc,sc);
  ctx.fillStyle='#F2F2F2';ctx.beginPath();ctx.roundRect(-45,-55,90,110,14);ctx.fill();
  ctx.lineWidth=14;ctx.strokeStyle='#F2F2F2';ctx.beginPath();ctx.arc(52,0,26,-1.3,1.3);ctx.stroke();
  ctx.fillStyle=OR;ctx.fillRect(-45,-20,90,16);ctx.restore();
  // floating drops
  for(let i=0;i<4;i++){ctx.fillStyle='rgba(120,70,30,0.95)';ctx.beginPath();ctx.arc(x-40+i*30,y-110-i*18+Math.sin(i+rot*8)*8,9-i,0,TAU);ctx.fill();}}
function s10(t,d){
  starfield(t,t*0.2);
  const rot=CUE(0,1.3)*1.6+0.15+t*t*0.3;
  ctx.save();cam(t,d,1.0,1.06,W/2,1000);
  drawGlobe(W/2,1010,290,rot+1.2,0.18);
  // floating mug teaser (gravity off)
  const m=seg(t,0.6,1.2);if(m>0){ctx.globalAlpha=m;const fy=lerp(860,780,ease(seg(t,0.6,d)));mug(W/2+250,fy+Math.sin(t*2)*14,1.1,Math.sin(t*1.5)*0.35);ctx.globalAlpha=1;}
  ctx.restore();
  pill('PROCHAIN ÉPISODE',W/2,300,40,seg(t,0,0.2));
  const a=seg(t,0.15,0.4);if(a>0){const sc=lerp(1.4,1,eback(a));ctx.save();ctx.translate(W/2,420);ctx.scale(sc,sc);txt('ET SI ?',0,0,120,OR,900,'center',a,4);ctx.restore();}
  const q=seg(t,0.4,0.7);txt('la gravité disparaissait',W/2,535,62,'#fff',900,'center',q);txt('pendant 5 secondes ?',W/2,610,62,'#fff',900,'center',q);
  // subscribe button
  const c10=CUE(9,3.0);const b=seg(t,c10,c10+0.25);if(b>0){const pul=1+0.06*Math.max(0,Math.sin((t-c10-0.25)*9))*(t>c10+0.25?1:0);ctx.save();ctx.translate(W/2,1350);ctx.scale(lerp(0.6,1,eback(b))*pul,lerp(0.6,1,eback(b))*pul);
    ctx.globalAlpha=b;ctx.shadowColor=OR;ctx.shadowBlur=40;ctx.fillStyle=OR;ctx.beginPath();ctx.roundRect(-270,-62,540,124,62);ctx.fill();ctx.shadowBlur=0;
    // bell
    ctx.fillStyle='#0B1A33';ctx.beginPath();ctx.moveTo(-215,22);ctx.quadraticCurveTo(-215,-38,-185,-38);ctx.quadraticCurveTo(-155,-38,-155,22);ctx.closePath();ctx.fill();ctx.fillRect(-223,18,76,8);ctx.beginPath();ctx.arc(-185,34,9,0,TAU);ctx.fill();
    ctx.font='900 50px M';ctx.fillStyle='#0B1A33';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('ABONNE-TOI',45,4);ctx.restore();}
}
const SCENES=[s1,s2,s3,s4,s5,s6,s7,s8,s9,s10];

/* ---------- captions ---------- */
let CAPS=[];const KEY=new Set(['terre','tourner','1 670 km/h','équateur','sol','est','atmosphère','vents','océans','inondations','pôles','gravité','orbite','soleil','année','rotation','scénario','seconde']);
function setCaptions(c,oy){CAPS=c;if(oy!=null)OUTRO_Y=oy;}
function drawCaption(T){
  const c=CAPS.find(c=>T>=c.s&&T<c.e);if(!c)return;
  const k=clamp((T-c.s)/0.12);const sc=lerp(1.12,1,eout(k));
  ctx.save();ctx.translate(W/2,T>OUTRO_Y?1560:1500);ctx.scale(sc,sc);
  ctx.font='900 74px M';ctx.textBaseline='middle';ctx.lineJoin='round';
  // wrap into lines max 880
  const toks=c.toks;const lines=[[]];let lw=0;const sp=ctx.measureText(' ').width;
  for(const tk of toks){const w=ctx.measureText(tk.w).width;if(lw+w>880&&lines[lines.length-1].length){lines.push([]);lw=0;}lines[lines.length-1].push({...tk,width:w});lw+=w+sp;}
  lines.forEach((ln,i)=>{const tot=ln.reduce((s,x)=>s+x.width,0)+sp*(ln.length-1);let x=-tot/2;const y=(i-(lines.length-1)/2)*90;
    for(const tk of ln){ctx.textAlign='left';ctx.lineWidth=14;ctx.strokeStyle='rgba(0,0,0,0.9)';ctx.strokeText(tk.w,x,y);ctx.fillStyle=tk.k?OR:'#fff';ctx.fillText(tk.w,x,y);x+=tk.width+sp;}});
  ctx.restore();
}
function render(T,si,lt,dur){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);
  ctx.save();SCENES[si](lt,dur);ctx.restore();
  // flash-in on cut
  const f=clamp(1-lt/0.12);if(f>0&&si>0){ctx.fillStyle=`rgba(255,240,230,${f*0.35})`;ctx.fillRect(0,0,W,H);}
  finish(T);drawCaption(T);
  // fade out at very end
  return cv.toDataURL('image/jpeg',0.92);
}
window.READY=document.fonts.load('900 74px M').then(()=>document.fonts.load('700 30px M')).then(()=>true);
