<script>
const NS = "http://www.w3.org/2000/svg";
const E = window.EDITION;
const TL = window.TL, FPS = TL.fps;
const T_OPEN = TL.open, T_RUB = TL.rub, RUB_LEN = TL.rubLen;
const RS = TL.rubStarts || [0, 1, 2].map((i) => T_RUB + i * RUB_LEN);
const T_OUTRO = TL.outro || T_RUB + 3 * RUB_LEN, DUR = T_OUTRO + TL.outroLen;
const HOOK_SUB = TL.hookSub || [0.35, 2.95];
const VENV = window.VOICE_ENV || null;
window.DURATION = DUR; window.FPS = FPS;

const $ = (id) => document.getElementById(id);
const el = (tag, attrs, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (k) => k * k * (3 - 2 * k);
const easeBack = (k) => { const c = 1.7; k = k - 1; return 1 + k * k * ((c + 1) * k + c); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- décor statique ----------
(function buildStatic() {
  const st = $("stripes");
  for (let x = 230; x < 1080; x += 64) el("rect", { x, y: 0, width: 26, height: 1010, fill: "#C2AB84" }, st);
  const tk = $("ticks");
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6;
    el("line", { x1: Math.sin(a) * 66, y1: -Math.cos(a) * 66, x2: Math.sin(a) * 74, y2: -Math.cos(a) * 74, stroke: "#2A1E14", "stroke-width": i % 3 ? 3 : 6 }, tk);
  }
  const bd = $("beads");
  for (let i = 0; i < 40; i++) {
    const a = i / 40 * Math.PI * 2;
    el("circle", { cx: Math.cos(a) * 222, cy: Math.sin(a) * 182, r: 4.5, fill: "#F3DC9A", stroke: "#5C4630", "stroke-width": 2 }, bd);
  }
  const gr = $("grain"), r = rng(7);
  for (let i = 0; i < 26; i++) {
    const y = 1240 + i * 26 + r() * 10, x = 60 + r() * 200;
    el("path", { d: `M${x} ${y} C${x + 200} ${y - 12} ${x + 500} ${y + 14} ${x + 760} ${y - 4}`, stroke: "#5A3D25", "stroke-width": 3, fill: "none", opacity: 0.7 }, gr);
  }
  const rays = $("rays");
  for (let i = 0; i < 24; i++) {
    const a0 = i / 24 * Math.PI * 2, a1 = a0 + Math.PI / 24;
    if (i % 2) continue;
    el("path", { d: `M540 1050 L${540 + Math.cos(a0) * 1600} ${1050 + Math.sin(a0) * 1600} L${540 + Math.cos(a1) * 1600} ${1050 + Math.sin(a1) * 1600} Z`, fill: "#3D2C1E" }, rays);
  }
  $("dateTxt").textContent = E.date;
})();

// ---------- globes ----------
function makeGlobe(parent, r) {
  const g = { r, mer: [], land: [] };
  el("circle", { r, fill: "#E6D6B2" }, parent);
  const lands = [[0.0, -0.25, 0.32, 0.22], [1.4, 0.15, 0.26, 0.34], [2.6, -0.4, 0.22, 0.16], [3.7, 0.3, 0.3, 0.2], [4.9, -0.05, 0.2, 0.3]];
  for (const [lon, lat, w, h] of lands) {
    const e = el("ellipse", { fill: "#8C6A30", stroke: "#2A1E14", "stroke-width": r / 40 }, parent);
    g.land.push({ e, lon, lat, w, h });
  }
  for (let i = 0; i < 6; i++) g.mer.push(el("ellipse", { cx: 0, cy: 0, ry: r, fill: "none", stroke: "#2A1E14", "stroke-width": r / 50, opacity: 0.55 }, parent));
  for (const k of [-0.5, 0, 0.5]) el("ellipse", { cx: 0, cy: k * r, rx: r * Math.sqrt(1 - k * k), ry: r * 0.08, fill: "none", stroke: "#2A1E14", "stroke-width": r / 50, opacity: 0.55 }, parent);
  el("ellipse", { cx: -r * 0.35, cy: -r * 0.4, rx: r * 0.35, ry: r * 0.2, fill: "#fff", opacity: 0.25 }, parent);
  return g;
}
function updateGlobe(g, phase) {
  g.mer.forEach((m, i) => m.setAttribute("rx", Math.abs(Math.cos(phase + i * Math.PI / 6)) * g.r));
  for (const L of g.land) {
    const a = L.lon + phase, c = Math.cos(a);
    if (c <= 0.02) { L.e.setAttribute("display", "none"); continue; }
    L.e.setAttribute("display", "inline");
    L.e.setAttribute("cx", Math.sin(a) * g.r * Math.sqrt(1 - L.lat * L.lat));
    L.e.setAttribute("cy", L.lat * g.r);
    L.e.setAttribute("rx", L.w * g.r * c);
    L.e.setAttribute("ry", L.h * g.r);
  }
}
const globeS = makeGlobe($("globeS"), 62);
const globeL = makeGlobe($("globeL"), 240);
const globeO = makeGlobe($("ill-globe"), 140);

// ---------- illustrations ----------
const ill = {};
(function buildPay() {
  const g = $("ill-pay");
  const paper = el("g", { transform: "translate(-40,0) rotate(-8)" }, g);
  el("rect", { x: -110, y: -135, width: 190, height: 260, fill: "#FBF5E6", stroke: "#2A1E14", "stroke-width": 5 }, paper);
  el("rect", { x: -96, y: -120, width: 162, height: 34, fill: "#2A1E14" }, paper);
  const t = el("text", { x: -15, y: -96, "text-anchor": "middle", class: "play", "font-size": 22, fill: "#F1E6CC" }, paper); t.textContent = "BULLETIN";
  const r = rng(3);

function poseTrack(t) {
  const tr = [[0, "brow"]];
  tr.push([T_OPEN, "talk"]);
  for (let i = 0; i < 3; i++) {
    const S = RS[i], ins = E.rubriques[i].insolite;
    tr.push([S, "tap"], [S + 0.9, "window"], [S + 2.7, ins ? "brow" : "talk"], [S + 6.2, "read"], [S + 7.3, ins ? "brow" : "talk"]);
  }
  tr.push([T_OUTRO, "talk"], [T_OUTRO + TL.outroRight, "right"], [T_OUTRO + TL.outroSalute, "salute"]);
  let i = 0; while (i + 1 < tr.length && tr[i + 1][0] <= t) i++;
  const cur = POSES[tr[i][1]], prev = POSES[(tr[i - 1] || tr[i])[1]];
  const k = ease(clamp((t - tr[i][0]) / 0.28));
  const p = {};
  for (const key in cur) p[key] = typeof cur[key] === "number" ? lerp(prev[key], cur[key], k) : (k > 0.5 ? cur[key] : prev[key]);
  p.name = k > 0.5 ? tr[i][1] : (tr[i - 1] || tr[i])[1];
  p.since = t - tr[i][0];
  return p;
}
function setArm(side, sx, sy, ex, ey, bend) {
  const mx = (sx + ex) / 2, my = (sy + ey) / 2, dx = ex - sx, dy = ey - sy, L = Math.hypot(dx, dy) || 1;
  const cx = mx - dy / L * bend, cy = my + dx / L * bend;
  const d = `M${sx} ${sy} Q${cx} ${cy} ${ex} ${ey}`;
  $("arm" + side).setAttribute("d", d); $("arm" + side + "o").setAttribute("d", d);
  return Math.atan2(ey - cy, ex - cx) * 180 / Math.PI;
}

// ---------- texte ----------
function lineMarkup(line) {
  return line.split(/(\*[^*]+\*)/).filter(Boolean).map(seg =>
    seg.startsWith("*") ? `<tspan fill="#E9B54C">${esc(seg.slice(1, -1))}</tspan>` : esc(seg)).join("");
}
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
const fitCache = {};
function setSub(lines, alpha, pop) {
  const g = $("sub");
  if (!lines || alpha <= 0) { g.setAttribute("display", "none"); return; }
  g.setAttribute("display", "inline");
  const key = lines.join("|"), txt = $("subTxt");
  let fs = 54;
  if (txt.dataset.key !== key) {
    txt.dataset.key = key;
    txt.setAttribute("font-size", fs);
    txt.innerHTML = lines.map((l, i) => `<tspan x="420" dy="${i ? 1.25 : 0}em">${lineMarkup(l)}</tspan>`).join("");
    const w = txt.getBBox().width;
    if (w > 640) fs = Math.floor(fs * 640 / w);
    fitCache[key] = fs;
  }
  fs = fitCache[key];
  txt.setAttribute("font-size", fs);
  const n = lines.length, lh = fs * 1.25, h = n * lh + 64, top = 1248 - h / 2;
  $("subBox").setAttribute("y", top); $("subBox").setAttribute("height", h);
  $("subIn").setAttribute("y", top + 12); $("subIn").setAttribute("height", h - 24);
  txt.setAttribute("y", top + 32 + fs * 0.85);
  const s = 0.9 + 0.1 * easeBack(clamp(pop));
  g.setAttribute("opacity", alpha);
  g.setAttribute("transform", `translate(420 1248) scale(${s}) translate(-420 -1248)`);
}
function fitText(id, text, max, fs0) {
  const t = $(id);
  if (t.dataset.key === text) return;
  t.dataset.key = text; t.textContent = text; t.setAttribute("font-size", fs0);
  const w = t.getBBox().width; if (w > max) t.setAttribute("font-size", Math.floor(fs0 * max / w));
}

// ---------- images de grain ----------
const GRAINS = 8;
// ---------- rendu d'une image ----------
window.renderFrame = function (f) {
  const t = f / FPS, R = rng(f * 9973 + 17);

  // segment courant
  let seg = "hook", rub = null, lt = t, ri = -1;
  if (t >= T_OPEN && t < T_RUB) { seg = "open"; lt = t - T_OPEN; }
  else if (t >= T_RUB && t < T_OUTRO) { seg = "rub"; ri = 0; while (ri < 2 && t >= RS[ri + 1]) ri++; rub = E.rubriques[ri]; lt = t - RS[ri]; }
  else if (t >= T_OUTRO) { seg = "outro"; lt = t - T_OUTRO; }

  // horloge, globe
  $("secHand").setAttribute("transform", `rotate(${Math.floor(t) * 6 + (t % 1 < 0.08 ? 2 : 0)})`);
  updateGlobe(globeS, t * 0.9);

  // ouverture
  $("opening").setAttribute("display", seg === "open" ? "inline" : "none");
  if (seg === "open") {
    const cd = lt < 0.75;
    $("countdown").setAttribute("display", cd ? "inline" : "none");
    $("titleCard").setAttribute("display", cd ? "none" : "inline");
    if (cd) {
      const n = 3 - Math.floor(lt / 0.25), p = (lt % 0.25) / 0.25, a = p * Math.PI * 2;
      $("cdNum").textContent = n;
      const x = 540 + Math.sin(a) * 1400, y = 960 - Math.cos(a) * 1400;
      $("sweep").setAttribute("d", `M540 960 L540 -440 A1400 1400 0 ${a > Math.PI ? 1 : 0} 1 ${x} ${y} Z`);
    } else {
      const k = clamp((lt - 0.75) / 0.3);
      const s = 0.55 + 0.45 * easeBack(k);
      $("titleZoom").setAttribute("transform", `translate(540 1050) scale(${s}) translate(-540 -1050)`);
      $("rays").setAttribute("transform", `rotate(${lt * 30} 540 1050)`);
      updateGlobe(globeL, lt * 3);
    }
  }

  // bandeau + titre
  const showBanner = seg === "rub" || seg === "outro";
  $("banner").setAttribute("display", showBanner ? "inline" : "none");
  $("titleStrip").setAttribute("display", seg === "rub" ? "inline" : "none");
  if (showBanner) {
    const txt = seg === "rub" ? rub.category : "À DEMAIN !";
    fitText("bannerTxt", txt, 820, 76);
    const k = easeBack(clamp(lt / 0.4));
    $("banner").setAttribute("transform", `translate(${(1 - k) * -1100},0)`);
  }
  if (seg === "rub") {
    fitText("titleTxt", rub.title, 840, 44);
    const k = ease(clamp((lt - 0.35) / 0.3));
    $("titleStrip").setAttribute("opacity", k);
    $("titleStrip").setAttribute("transform", `translate(0,${(1 - k) * -30})`);
  }

  // illustration
  let illName = E.hookIllustration, illT = t;
  if (seg === "rub") { illName = rub.illustration; illT = lt; }
  if (seg === "outro") { illName = "globe"; illT = lt; }
  updateIll(illName, illT, t);
  let flashO = 0;
  if (seg === "rub") flashO = clamp(1 - Math.abs(lt - 0.8) / 0.25);
  if (seg === "outro") flashO = clamp(1 - Math.abs(lt) / 0.25);
  $("ovalFlash").setAttribute("opacity", flashO);

  // sous-titres
  let lines = null, alpha = 0, pop = 1;
  const win = (a, b, x) => { if (x >= a && x < b) { alpha = clamp(Math.min((x - a) / 0.15, (b - x) / 0.12)); pop = (x - a) / 0.25; return true; } return false; };
  if (seg === "hook") { if (win(HOOK_SUB[0], HOOK_SUB[1], t)) lines = E.hook; }
  if (seg === "rub") {
    const W = TL.rubSubsList ? TL.rubSubsList[ri] : TL.rubSubs;
    W.forEach(([a, b], i) => { if (win(a, b, lt)) lines = rub.subs[i]; });
  }
  if (seg === "outro") {
    if (win(TL.outroSubs[0][0], TL.outroSubs[0][1], lt)) lines = E.question;
    else if (win(TL.outroSubs[1][0], TL.outroSubs[1][1], lt)) lines = E.subscribe;
  }
  setSub(lines, alpha, pop);
  const talking = !!lines;

  // Maurice
  const p = poseTrack(t);
  const bob = Math.sin(t * Math.PI * 2) * 4;
  let lx = p.lx, ly = p.ly, rx = p.rx, ry = p.ry;
  if (p.name === "tap") { const b = -Math.abs(Math.sin(p.since * Math.PI * 3.4)) * 40; ly += b; ry += b; }
  if (p.name === "salute") { const w = Math.sin(p.since * Math.PI * 5) * 14; rx += w; }
  if (p.name === "window" || p.name === "right") { rx += Math.sin(t * 7) * 5; ry += Math.cos(t * 7) * 4; }
  $("mBody").setAttribute("transform", `translate(0,${bob * 0.5})`);
  $("mHead").setAttribute("transform", `translate(0,${bob + p.dy}) rotate(${p.tilt + Math.sin(t * 2.3) * 1.5} 0 900)`);
  const sh = SH;
  const aL = setArm("L", sh.L[0], sh.L[1] + bob * 0.5, lx, ly, -50);
  const aR = setArm("R", sh.R[0], sh.R[1] + bob * 0.5, rx, ry, p.rh === "point" ? 60 : 50);
  for (const [side, x, y, a, kind] of [["L", lx, ly, aL, p.lh], ["R", rx, ry, aR, p.rh]]) {
    const h = hands[side];
    h.cuff.setAttribute("cx", x); h.cuff.setAttribute("cy", y);
    const flip = side === "L" && kind === "hold" ? " scale(1,-1)" : "";
    const ang = kind === "open" ? -100 + Math.sin(t * 12) * 10 : a;
    h.rot.setAttribute("transform", `translate(${x},${y}) rotate(${ang})${flip}`);
    h.hold.setAttribute("display", kind === "hold" ? "inline" : "none");
    h.point.setAttribute("display", kind === "point" ? "inline" : "none");
    h.open.setAttribute("display", kind === "open" ? "inline" : "none");
  }
  // feuilles
  let px, py, prot = 0, psx = 1, psy = 1;
  if (p.pap === "tap") { px = (lx + rx) / 2; py = (ly + ry) / 2 - 10; prot = 0; psx = 0.9; psy = 1.1; }
  else if (p.pap === "read") { px = (lx + rx) / 2; py = (ly + ry) / 2 - 6; prot = 0; psx = 1.25; psy = 1.25; }
  else if (p.pap === "left") { px = lx + 70; py = 1175; prot = -6; psy = 0.35; }
  else { px = 0; py = 1172; prot = 0; psy = 0.35; }
  papersG.setAttribute("transform", `translate(${px},${py}) rotate(${prot}) scale(${psx},${psy})`);
  sheets.forEach((s, i) => s.setAttribute("transform", `translate(${(i - 1) * 6},${(i - 1) * -4}) rotate(${(i - 1) * 3})`));
  // visage
  const blink = (t % 3.3) < 0.12 ? 0.15 : 1;
  for (const [id, x] of [["eyeL", -38], ["eyeR", 38]]) $(id).setAttribute("transform", `translate(${x + p.lookX},${806 + p.lookY}) scale(1,${blink})`);
  $("browR").setAttribute("transform", `translate(0,${-20 * p.browR}) rotate(${-10 * p.browR} 40 750)`);
  $("browL").setAttribute("transform", `translate(0,${-14 * p.browL}) rotate(${8 * p.browL} -40 750)`);
  $("nose").setAttribute("cx", p.lookX * 0.6);
  let mo = 0;
  if (VENV) mo = clamp(((VENV[f] || 0) - 0.08) * 1.4);
  else if (talking) mo = clamp((0.5 + 0.5 * Math.sin(t * Math.PI * 2 * 4.7)) * (0.55 + 0.45 * Math.sin(t * Math.PI * 2 * 1.3 + 1)));
  if (seg === "open") mo = 0;
  $("mouthC").setAttribute("display", mo < 0.12 ? "inline" : "none");
  $("mouthO").setAttribute("display", mo >= 0.12 ? "inline" : "none");
  $("mouthE").setAttribute("ry", 6 + mo * 18);
  $("tongue").setAttribute("cy", 906 + mo * 12);

  // effets film
  $("grainImg").setAttribute("href", `grain/g${f % GRAINS}.jpg`);
  const sc = $("scratches"); sc.innerHTML = "";
  const nS = Math.floor(R() * 3);
  for (let i = 0; i < nS; i++) {
    const x = 60 + R() * 960, w = 1 + R() * 2.5, y0 = R() * 600, y1 = 1300 + R() * 620;
    el("line", { x1: x, y1: y0, x2: x + (R() - 0.5) * 20, y2: y1, stroke: R() < 0.7 ? "#1a120a" : "#fff7e0", "stroke-width": w, opacity: 0.25 + R() * 0.35 }, sc);
  }
  if (R() < 0.35) for (let i = 0; i < 1 + R() * 3; i++) el("circle", { cx: R() * 1080, cy: R() * 1920, r: 2 + R() * 7, fill: "#120c08", opacity: 0.5 }, sc);
  if (R() < 0.06) el("path", { d: `M${R() * 1080} ${R() * 1920} q${R() * 60} ${R() * 40} ${R() * 90} ${R() * -30}`, stroke: "#120c08", "stroke-width": 3, fill: "none", opacity: 0.6 }, sc);
  $("flicker").setAttribute("opacity", 0.04 + R() * 0.07);
  const wx = (R() - 0.5) * 3, wy = (R() - 0.5) * 4;
  // collure entre les parties
  let fl = 0, jump = 0;
  for (const b of [T_OPEN, ...RS, T_OUTRO]) {
    const d = t - b;
    if (d >= 0 && d < 0.09) { fl = 0.75 * (1 - d / 0.09); jump = 40 * (1 - d / 0.09); }
  }
  $("flash").setAttribute("opacity", fl);
  $("weave").setAttribute("transform", `translate(${wx},${wy + jump})`);

  // iris
  let ir = 1300;
  if (t < 0.4) ir = 1300 * ease(t / 0.4);
  const tc = DUR - 0.75;
  if (t >= tc) ir = 1300 * (1 - ease(clamp((t - tc) / 0.6)));
  $("irisHole").setAttribute("r", Math.max(0, ir));
  $("irisHole").setAttribute("cy", t >= tc ? 860 : 900);
  $("irisHole").setAttribute("cx", t >= tc ? 500 : 540);
};
// ---------- image de story ----------
window.renderStory = function () {
  // fond : la carte titre de l'opening, globe et titre remontés
  window.renderFrame(Math.round((T_OPEN + 1.45) * FPS));
  $("irisHole").setAttribute("r", 1300);
  $("flash").setAttribute("opacity", 0);
  $("weave").setAttribute("transform", "");
  $("titleZoom").setAttribute("transform", "translate(540 600) scale(0.62) translate(-540 -1050)");
  const g = $("story"); g.innerHTML = ""; g.setAttribute("display", "inline");
  E.rubriques.forEach((r, i) => {
    const y = 930 + i * 215;
    el("rect", { x: 70, y: y, width: 940, height: 180, rx: 14, fill: "#F1E6CC", stroke: "#120c08", "stroke-width": 6 }, g);
    el("path", { d: `M50 ${y - 26} H560 L535 ${y + 6} L560 ${y + 38} H50 L75 ${y + 6} Z`, fill: "#B5482F", stroke: "#120c08", "stroke-width": 5 }, g);
    const c = el("text", { x: 305, y: y + 22, "text-anchor": "middle", class: "lime", "font-size": 44, fill: "#F1E6CC", "letter-spacing": 4 }, g);
    c.textContent = r.category;
    const t = el("text", { x: 540, y: y + 125, "text-anchor": "middle", class: "play", "font-size": 50, fill: "#2A1E14", "font-style": "italic" }, g);
    t.textContent = r.title;
    const w = t.getBBox().width; if (w > 860) t.setAttribute("font-size", Math.floor(50 * 860 / w));
  });
  const y = 1600;
  el("path", { d: `M90 ${y - 55} H990 L1030 ${y} L990 ${y + 55} H90 L50 ${y} Z`, fill: "#2A1E14", stroke: "#E9B54C", "stroke-width": 5 }, g);
  const b = el("text", { x: 540, y: y + 18, "text-anchor": "middle", class: "lime", "font-size": 50, fill: "#E9B54C", "letter-spacing": 3 }, g);
  b.textContent = E.storyCta || "LE JT EST EN LIGNE !";
};
window.ready = document.fonts.ready.then(() => { window.renderFrame(0); return true; });
