name: Et si ? — images sur Kaggle (GPU)
on:
  push:
    branches: [et-si]
    paths:
      - 'et-si/survie/kaggle/**'
      - '.github/workflows/et-si-kaggle.yml'
  workflow_dispatch:
    inputs:
      prompts: { description: "Fichier de prompts", default: "et-si/survie/kaggle/essai-ep001.json" }
permissions:
  contents: write
concurrency:
  group: et-si-kaggle
  cancel-in-progress: true
jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY || secrets.KAGGLE_API_KEY || secrets.KAGGLE_SECRET }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
      PROMPTS: ${{ github.event.inputs.prompts || 'et-si/survie/kaggle/essai-ep001.json' }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Vérifier les identifiants Kaggle
        run: |
          echo "nom : ${KAGGLE_USERNAME:+présent} · clé : ${KAGGLE_KEY:+présente} · token : ${KAGGLE_API_TOKEN:+présent}"
          if [ -z "$KAGGLE_KEY" ] && [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::Aucune clé Kaggle (KAGGLE_KEY ou KAGGLE_API_TOKEN) dans les secrets"; exit 1; fi
          [ -z "$KAGGLE_KEY" ] && unset KAGGLE_KEY
          [ -z "$KAGGLE_API_TOKEN" ] && unset KAGGLE_API_TOKEN
          pip install -q -U kaggle && kaggle --version && kaggle kernels list --mine --page-size 3
      - name: Envoyer le notebook GPU
        run: |
          [ -z "$KAGGLE_KEY" ] && unset KAGGLE_KEY; [ -z "$KAGGLE_API_TOKEN" ] && unset KAGGLE_API_TOKEN
          export NOM=$(basename "$PROMPTS" .json); export SLUG="etsi-images-$NOM"; echo "SLUG=$SLUG" >> "$GITHUB_ENV"; echo "NOM=$NOM" >> "$GITHUB_ENV"
          mkdir -p k && python3 - <<'PY'
          import json, os
          p = open(os.environ['PROMPTS']).read(); json.loads(p)
          code = open('et-si/survie/kaggle/images_gpu.py').read().replace('__PROMPTS__', p)
          open('k/images.py', 'w').write(code)
          json.dump({"id": f"{os.environ['KAGGLE_USERNAME']}/{os.environ['SLUG']}", "title": os.environ['SLUG'], "code_file": "images.py",
                     "language": "python", "kernel_type": "script", "is_private": True, "enable_gpu": True, "enable_internet": True,
                     "dataset_sources": [], "competition_sources": [], "kernel_sources": []}, open('k/kernel-metadata.json', 'w'))
          PY
          kaggle kernels push -p k
      - name: Attendre la fin sur Kaggle
        run: |
          [ -z "$KAGGLE_KEY" ] && unset KAGGLE_KEY; [ -z "$KAGGLE_API_TOKEN" ] && unset KAGGLE_API_TOKEN
          for i in $(seq 1 100); do S=$(kaggle kernels status "$KAGGLE_USERNAME/$SLUG" 2>&1 | tail -1); echo "$(date +%H:%M) $S"
            case "$S" in *COMPLETE*|*complete*) break;; *ERROR*|*error*|*CANCEL*) kaggle kernels output "$KAGGLE_USERNAME/$SLUG" -p out || true; tail -50 out/*.log 2>/dev/null; exit 1;; esac; sleep 45; done
          kaggle kernels output "$KAGGLE_USERNAME/$SLUG" -p out; ls -la out out/images || true
      - name: Publier sur et-si-sorties
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone -q --depth 1 -b et-si-sorties "$URL" pub; mkdir -p "pub/images/kaggle-$NOM"
          cp out/images/*.png "pub/images/kaggle-$NOM/" 2>/dev/null || cp out/*.png "pub/images/kaggle-$NOM/"
          cd pub && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Images Kaggle $NOM" || exit 0
          git push -q "$URL" et-si-sorties
