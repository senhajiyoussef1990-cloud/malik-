<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="cv" width="1080" height="810"></canvas>
<script src="kit.js"></script>
<script src="scenes.js"></script>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let PLANS = null, BOUCHE = null;
window.init = (plans, bouche) => { PLANS = plans; BOUCHE = bouche; return true; };
window.renderFrame = (n, t) => {
  const s = PLANS.find(p => p.n === n);
  const E = { L: s.lignes, T0: s.t0,
    m: (id, tt) => { const l = s.lignes[id]; if (!l) return 0; const k = Math.floor((tt - l[0]) * 24), e = BOUCHE[id] || []; return k >= 0 && k < e.length ? Math.min(1, e[k] * 1.1) : 0; } };
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 1080, 810);
  SCENES[n](ctx, t, E);
  return cv.toDataURL('image/jpeg', 0.92);
};
</script></body></html>
